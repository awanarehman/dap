<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Action Plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='22' height='22' rx='3' fill='%23fff' stroke='%231B2430' stroke-width='3'/%3E%3Cpath d='M9 16c3 2 5 5 7 8 4-8 9-14 15-19' fill='none' stroke='%231C4FA1' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<!--
  Daily Action Plan (DAP): Work Management System, Parts 1 to 5.
  One self-contained file. No libraries, nothing to install.
  Open in Edge or Chrome. Data is kept in "DAP Data/dap-data.json" in the folder you choose.

  Code map (search for these headings):
    1. Helpers          2. Data model        3. Saving (file + browser copy)
    4. Actions          5. Drawing the page  6. Events            7. Start-up
-->
<style>
:root{
  --desk:#DCE2E6;      /* the desk under the sheet */
  --paper:#FFFFFF;
  --ink:#1B2430;       /* blue-black: steps and interface text */
  --red:#B3222B;       /* red pen: the plan itself */
  --blue:#1C4FA1;      /* blue pen: ticks and notes */
  --tab:#F2C230;       /* file divider tab */
  --rule:#D9DFE5;
  --faint:#F1F4F6;
  --muted:#667382;
  --f-plan:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:2px}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.wrap{padding:20px 16px 60px;transition:padding-right .15s}
.sheet{max-width:1180px;margin:0 auto;background:var(--paper);border:1px solid #C3CCD3;box-shadow:0 1px 0 #B9C2C9, 0 10px 24px -18px rgba(27,36,48,.55);padding:26px 30px 22px}
body.drawer-open .wrap{padding-right:416px}

/* ---------- header ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.top h1{margin:0;font-family:var(--f-plan);font-weight:600;font-size:28px;line-height:1.05;color:var(--red);letter-spacing:.01em;display:flex;gap:.7em;align-items:baseline;flex-wrap:wrap}
.top h1 .date{font-variant-numeric:tabular-nums}
.top .sub{margin:6px 0 0;color:var(--muted);font-size:13px}
.tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tools .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* the bar with search, undo, redo and the save and sync lines stays at the top of the window while the DAP scrolls */
.bar{position:sticky;top:var(--alerts-h,0px);z-index:12;display:flex;align-items:center;gap:6px;margin:0 -30px;padding:8px 30px;background:var(--paper);border-bottom:1px solid var(--rule)}
.bar.stuck{box-shadow:0 6px 10px -8px rgba(27,36,48,.45)}
.bar .qbox{width:260px}
.bar .ur{display:inline-flex;align-items:center;gap:5px}
.bar .urk{font-size:15px;line-height:1}
.status{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:0}
#savestate{font-size:12.5px;color:var(--muted);text-align:right}
#savestate.warn{color:var(--red)}
#syncstate{font-size:12.5px;color:var(--muted);text-align:right}
#syncstate.warn{color:var(--red);font-weight:600}
html{scroll-padding-top:calc(var(--alerts-h,0px) + 64px)}
.row{scroll-margin-top:calc(var(--alerts-h,0px) + 64px)}
input.devname{width:140px;border:1px solid #AEB8C1;border-radius:4px;padding:2px 6px;font:inherit}
body.native .grip{display:none}
.btn{background:var(--paper);border:1px solid #AEB8C1;border-radius:4px;padding:5px 11px;font-size:13px;line-height:1.3}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default;border-color:#AEB8C1}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.quiet{border-color:transparent;color:var(--muted);padding:4px 7px}
.btn.quiet:hover{color:var(--ink);border-color:#AEB8C1}
.btn.danger{color:var(--red)}

.notice{margin:14px 0 0;padding:10px 14px;background:#FFF8DC;border-left:4px solid var(--tab);display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;font-size:13.5px}
.notice.bad{background:#FCEDEE;border-left-color:var(--red)}
.notice.day{background:var(--faint);border-left-color:var(--ink)}

/* ---------- moving between days ---------- */
.days{display:flex;align-items:center;flex-wrap:wrap;gap:6px 4px;margin:12px 0 0;min-width:0}
.dayrow{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;min-width:0;max-width:100%}
.pickbtn{display:inline-flex;align-items:center;gap:6px}
.pickbtn .cal{width:15px;height:15px;flex:none}
.tog{margin-left:auto;display:inline-flex;align-items:center;gap:9px;background:none;border:0;border-radius:4px;padding:5px 2px 5px 6px;font-size:13px;color:var(--ink)}
.tog:hover{background:var(--faint)}
.tog .sw{position:relative;flex:none;width:34px;height:20px;border-radius:10px;background:#B9C3CC;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tog[aria-checked=true] .sw{background:var(--blue)}
.tog[aria-checked=true] .sw::after{transform:translateX(14px)}
.dayarrow{font-size:20px;line-height:1;padding:5px 9px 7px;flex:none}
.daystrip{display:flex;flex:0 1 auto;gap:4px;overflow-x:auto;min-width:0;padding:2px;scrollbar-width:thin}
.daybtn{flex:none;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:3px 9px 2px;font-family:var(--f-plan);font-size:14px;line-height:1.2;font-variant-numeric:tabular-nums;text-align:center}
.daybtn span{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.daybtn b{font-weight:inherit}
.daybtn .ds{display:none}
.daybtn:hover{border-color:var(--ink)}
.daybtn.now{color:var(--red);border-color:#DDA9AD}
.daybtn.now span{color:var(--red)}
.daybtn.on,.daybtn.on:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.daybtn.on span{color:#C9D2DA}
.pickwrap{position:relative;display:inline-flex;flex:none}
.pickwrap input[type=date]{position:absolute;left:0;bottom:0;width:100%;height:100%;padding:0;border:0;opacity:0;pointer-events:none}
.pickwrap input[type=date].show{position:static;width:auto;height:auto;opacity:1;pointer-events:auto;border:1px solid #AEB8C1;border-radius:4px;padding:4px 6px;margin-left:6px}
.days .pickwrap{margin-left:8px}
.sheet.past .top h1,.sheet.future .top h1{color:var(--ink)}
.notice p{margin:0;flex:1 1 320px}

/* ---------- sections ---------- */
.section{margin-top:22px}
.shead{display:flex;align-items:stretch;gap:10px;border-bottom:1.5px solid var(--ink)}
.stab{font-family:var(--f-plan);font-weight:700;font-size:15px;background:var(--tab);color:var(--ink);min-width:30px;padding:5px 9px 3px;text-align:center;border-radius:5px 5px 0 0;font-variant-numeric:tabular-nums}
.sname{font-family:var(--f-plan);font-weight:600;font-size:17px;padding:4px 2px 2px;min-width:3ch;outline-offset:1px}
.stab.fixed{background:var(--ink);color:#fff}
.sname:empty::before{content:"Section name";color:var(--muted);font-weight:400}
.scount{align-self:center;color:var(--muted);font-size:12.5px;margin-left:2px}
.sact{margin-left:auto;display:flex;gap:2px;align-items:center;opacity:0;transition:opacity .1s}
.section:hover .sact,.section:focus-within .sact{opacity:1}
.section.drop-end .addtask{box-shadow:inset 0 2px 0 var(--blue)}

/* ---------- task rows ---------- */
.row{display:grid;grid-template-columns:18px 40px 26px minmax(190px,30%) 1fr auto;column-gap:6px;align-items:start;padding:8px 0 7px;border-bottom:1px solid var(--rule);position:relative}
.row.dragging{opacity:.4}
.latercap{padding:6px 0 4px 102px;font-size:12px;color:var(--muted);border-bottom:1px dashed #C3CCD4}
.row.later .num{font-size:12.5px;color:var(--muted);padding-top:3px;white-space:nowrap}
.row.later .title{color:#7C8794}
.row.later .sword{color:#7C8794}
.none{margin:0;padding:9px 0 8px 102px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--rule)}
.row.drop-before{box-shadow:inset 0 2px 0 var(--blue)}
.row.drop-after{box-shadow:inset 0 -2px 0 var(--blue)}
.row.has-notes .padtop{padding-top:16px}
.grip{background:none;border:0;padding:3px 0 0;width:18px;color:#B4BEC7;cursor:grab;font-size:13px;line-height:1;letter-spacing:-2px;opacity:0;touch-action:none}
.row:hover .grip,.row:focus-within .grip{opacity:1}
.grip:active{cursor:grabbing}
.num{font-family:var(--f-plan);font-size:16.5px;color:var(--red);text-align:right;font-variant-numeric:tabular-nums;padding-right:2px;line-height:1.35}
.tbox{position:relative;width:18px;height:18px;margin:2px 0 0 4px;padding:0;background:var(--paper);border:1.5px solid var(--ink);border-radius:3px}
.tbox .tk{position:absolute;left:1px;top:-3px;width:21px;height:17px;stroke-width:2.1}
.row.cancelled .tbox{border-color:#B4BEC7}
.row.cancelled .tbox::after{content:"";position:absolute;left:3px;right:3px;top:6.5px;border-top:1.5px solid #8793A0}
.tmain{min-width:0}
.title{display:inline-block;max-width:100%;min-width:4ch;font-family:var(--f-plan);font-weight:500;font-size:16.5px;line-height:1.35;color:var(--red);overflow-wrap:anywhere;border-radius:2px;outline-offset:1px}
.title:empty::before{content:"Task";color:var(--muted)}
.row.done .title{color:#8A6064}
.row.done .num,.row.cancelled .num{color:#9AA5B0}
.row.cancelled .title{color:#8793A0;text-decoration:line-through;text-decoration-thickness:1.5px}
.tnote{display:block;max-width:100%;background:none;border:0;padding:1px 0 0;text-align:left;color:var(--blue);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rend{padding-left:10px}
.pid{background:none;border:0;padding:3px 0 0;font-family:var(--f-plan);font-size:12.5px;color:#93A0AC;font-variant-numeric:tabular-nums;white-space:nowrap}
.pid:hover{color:var(--ink);text-decoration:underline}
.rend{position:relative;display:flex;align-items:flex-start;justify-content:flex-end;gap:2px;min-width:86px}
.rmore{background:none;border:0;border-radius:4px;width:22px;height:22px;padding:0;margin-top:-1px;color:#93A0AC;font-size:17px;line-height:1}
.rmore:hover,.rmore[aria-expanded=true]{color:var(--ink);background:var(--faint)}
.rmenu{position:absolute;right:0;top:24px;z-index:15;min-width:176px;background:var(--paper);border:1.5px solid var(--ink);padding:4px;display:flex;flex-direction:column;box-shadow:0 8px 18px -10px rgba(27,36,48,.6)}
.rmenu button{background:none;border:0;border-radius:3px;text-align:left;padding:6px 10px;font-size:13.5px;white-space:nowrap}
.rmenu button:hover,.rmenu button:focus-visible{background:var(--faint)}
.rmenu hr{border:0;border-top:1px solid var(--rule);margin:4px 0;width:100%}
.mrow{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 10px}
.mrow>span{flex:none;width:68px;font-size:12.5px;color:var(--muted)}
.rmenu .mrow button{border:1px solid var(--rule);padding:3px 8px;font-size:13px}
.rmenu .mrow button:hover,.rmenu .mrow button:focus-visible{border-color:var(--ink)}

/* ---------- reminders ---------- */
.bell{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px;margin-right:2px}
.rem{background:none;border:0;padding:0 0 0 8px;color:var(--blue);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rem.due,.snote .at.due{color:var(--red);font-weight:600}
.snote .at{font-variant-numeric:tabular-nums}
#alerts{position:sticky;top:0;z-index:15;background:var(--ink);color:#fff;box-shadow:0 2px 10px rgba(27,36,48,.35)}
.duerow{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:9px 18px;border-top:1px solid #3A4656}
.duerow:first-child{border-top:0}
.due-when{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.due-when .bell{width:14px;height:14px;vertical-align:-2px;margin-right:5px}
.due-what{background:none;border:0;padding:0;color:#fff;font-family:var(--f-plan);font-size:16px;text-align:left;text-decoration:underline;text-decoration-color:#7C8794;text-underline-offset:3px;overflow-wrap:anywhere}
.due-what:hover{text-decoration-color:#fff}
.due-under{color:#B9C3CD;font-size:13px}
.due-acts{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.due-acts .lbl{color:#B9C3CD;font-size:12.5px;margin-left:8px}
.due-acts .btn{background:transparent;border-color:#6B7785;color:#fff;padding:4px 9px}
.due-acts .btn:hover{border-color:#fff}
.due-acts .btn.primary{background:#fff;border-color:#fff;color:var(--ink)}
#alerts :focus-visible{outline-color:#fff}
.remlist{list-style:none;margin:0 0 8px;padding:0;border-top:1px solid var(--rule)}
.remlist li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--rule);font-size:13.5px;color:var(--blue);font-variant-numeric:tabular-nums}
.remlist li.due{color:var(--red);font-weight:600}
.state .pre{font-size:12.5px;color:var(--muted);min-width:16px}
.fld .state + .state{margin-top:6px}
.fld .state input[type=time],.fld .state select{width:auto;padding:4px 7px}
.err{margin:6px 0 0;color:var(--red);font-size:13px}
@media (min-width:1101px){ body.drawer-open #alerts{margin-right:400px} }
.row.drop-into{background:#F2F6FC;box-shadow:inset 3px 0 0 var(--blue)}
.addwrap{position:relative}
.dropzone{position:absolute;inset:0;display:none;align-items:center;padding-left:102px;background:#F2F6FC;border:1.5px dashed var(--blue);color:var(--blue);font-size:13.5px;pointer-events:none}
body.step-drag .dropzone{display:flex;pointer-events:auto}
.section.drop-task .dropzone{background:#D7E5FA;border-style:solid;font-weight:600}
.section.drop-task .shead{box-shadow:inset 0 -3px 0 var(--blue)}
.step.dragging,.mini.dragging{opacity:.35}
.step.drop-left::before,.step.drop-right::after{content:"";position:absolute;top:0;bottom:0;border-left:2.5px solid var(--blue)}
.step.drop-left::before{left:-11px}
.step.drop-right::after{right:-11px}

/* ---------- steps: an underlined word, ticked beneath ---------- */
.steps{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 20px;min-width:0;padding-left:8px}
.step{display:inline-flex;flex-direction:column;align-items:flex-start;position:relative;max-width:100%}
.snote{display:block;height:16px;font-size:11.5px;line-height:15px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.sbtn{background:none;border:0;padding:0;display:inline-flex;flex-direction:column;align-items:center;text-align:left;border-radius:2px}
.sline{display:inline-flex;align-items:flex-end;gap:3px}
.sword{font-family:var(--f-plan);font-size:15.5px;line-height:1.3;border-bottom:1.6px solid currentColor;padding:0 1px;overflow-wrap:anywhere}
.under{display:block;height:13px;line-height:0;padding-top:2px}
.tk{width:15px;height:11px;fill:none;stroke:var(--blue);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.sline>.tk{margin-bottom:4px}
.step.done>.sbtn .sword,.mini.done .sword{color:#56616E}
.step.cancelled>.sbtn .sword,.mini.cancelled .sword{color:#8793A0;border-bottom-color:transparent;text-decoration:line-through;text-decoration-thickness:1.5px}
.step.later>.sbtn .sword,.mini.later .sword{color:#7C8794;border-bottom-style:dashed}
.snote .from{color:var(--muted)}
.sbtn:not(:disabled):hover .sword{background:var(--faint)}
.sbtn:disabled,.tbox:disabled{cursor:default}
.sopen{position:absolute;right:-16px;top:0;width:15px;height:20px;padding:0;background:none;border:0;color:var(--muted);font-size:15px;line-height:1;opacity:0}
.step.noted>.sopen{top:16px}
.step:hover>.sopen,.sopen:focus-visible{opacity:1}
.sopen:hover{color:var(--ink)}
.subs{display:flex;flex-wrap:wrap;gap:2px 9px;padding-top:3px}
.mini .sword{font-size:12.5px;border-bottom-width:1.2px}
.mini .under{height:10px;padding-top:1.5px}
.mini .tk{width:11px;height:8px;stroke-width:2}
.mini .more{font-family:var(--f-ui);font-size:10.5px;color:var(--muted);border:0;margin-left:2px}
.addstep{border:0;border-bottom:1.6px dashed transparent;background:none;width:6ch;padding:0 1px;font-family:var(--f-plan);font-size:15.5px;line-height:1.3;outline:none}
.addstep::placeholder{color:#C3CCD4;transition:color .1s}
.row:hover .addstep::placeholder,.addstep:focus::placeholder{color:#8793A0}
.addstep:focus{width:18ch;border-bottom-color:var(--blue)}

.addtask{display:block;width:100%;border:0;border-bottom:1px solid var(--rule);background:none;padding:9px 0 8px 102px;font-family:var(--f-plan);font-size:16px;outline:none}
.addtask::placeholder{color:#9CA8B3}
.addtask:focus{border-bottom-color:var(--blue);background:var(--faint)}
.addsection{margin-top:18px}
.key{margin:22px 0 0;padding-top:10px;border-top:1px solid var(--rule);color:var(--muted);font-size:12.5px}
.key b{font-weight:600;color:#4B5766}

/* ---------- details drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:400px;max-width:100vw;background:var(--paper);border-left:2px solid var(--ink);display:flex;flex-direction:column;z-index:20}
.dhead{display:flex;align-items:flex-start;gap:8px;padding:14px 14px 10px 18px;border-bottom:1px solid var(--rule)}
.crumbs{flex:1;display:flex;flex-wrap:wrap;gap:2px 6px;align-items:baseline;font-size:12.5px;color:var(--muted);min-width:0}
.crumbs button{background:none;border:0;padding:0;color:var(--blue);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumbs button:hover{text-decoration:underline}
.crumbs .here{color:var(--ink);font-weight:600}
.dclose{background:none;border:0;font-size:22px;line-height:1;padding:0 4px;color:var(--muted)}
.dclose:hover{color:var(--ink)}
.drawer-body{flex:1;overflow:auto;padding:14px 18px 24px}
.fld{display:block;margin:0 0 16px}
.fld>span,.fld>.lbl{display:block;font-size:12.5px;font-weight:600;color:#4B5766;margin-bottom:4px}
.fld .hint{font-weight:400;color:var(--muted)}
.fld input[type=text],.fld textarea,.fld select{width:100%;border:1px solid #AEB8C1;border-radius:4px;padding:7px 9px;background:var(--paper)}
.fld textarea{resize:vertical;min-height:74px;line-height:1.4;color:var(--blue)}
.fld textarea.plain{color:var(--ink)}
.fld input.big{font-family:var(--f-plan);font-size:17px;font-weight:500;color:var(--red)}
.fld input.big.step{color:var(--ink)}
.state{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.fld .state{margin-bottom:0}
.when{margin:0 0 8px;font-size:13.5px}
.fld input:disabled,.fld textarea:disabled,.fld select:disabled{background:var(--faint);color:#4B5766;opacity:1}
.state .btn[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.klist{list-style:none;margin:0 0 6px;padding:0;border-top:1px solid var(--rule)}
.klist li{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid var(--rule)}
.klist .tbox{flex:none;margin:1px 0 0}
.klist li.cancelled .tbox{border-color:#B4BEC7}
.kname{flex:1;background:none;border:0;padding:0;text-align:left;font-family:var(--f-plan);font-size:15px;min-width:0;overflow-wrap:anywhere}
.kname:hover{text-decoration:underline}
.klist li.done .kname{color:#56616E}
.klist li.cancelled .kname{color:#8793A0;text-decoration:line-through}
.kinfo{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;padding-top:2px}
.addk{width:100%;border:0;border-bottom:1.6px dashed #AEB8C1;padding:6px 1px;font-family:var(--f-plan);font-size:15px;outline:none;background:none}
.addk:focus{border-bottom-color:var(--blue)}
.dmeta{font-size:12.5px;color:var(--muted);margin:4px 0 14px}

<body>
<div id="alerts" hidden aria-live="assertive"></div>
<div id="app"></div>
<script>
'use strict';

/* =====================================================================
   1. Helpers
   ===================================================================== */
const APP = 'daily-action-plan';
const SCHEMA = 2;
const DATA_DIR = 'DAP Data';
const DATA_FILE = 'dap-data.json';
const BACKUP_DIR = 'backups';
const BACKUPS_KEPT = 60;
const MIRROR_KEY = 'dap.mirror.v1';
const FS_OK = 'showDirectoryPicker' in window && !(window.Capacitor && window.capacitorExports);      // inside the phone app, the plan is kept by the app itself
const WEB_ADDRESS = 'https://awanarehman.github.io/dap/';                 // where the DAP is opened from, once it is published (see the setup notes)

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
const nowIso = () => new Date().toISOString();
const pad2 = n => String(n).padStart(2, '0');
const dayOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => dayOf(new Date());
const clockTime = d => `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const shortDate = day => { const [y, m, d] = day.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const longDate = day => { const [y, m, d] = day.split('-').map(Number); return new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date(y, m - 1, d)); };
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;
const oneLine = s => String(s || '').replace(/\s*\n\s*/g, ' ').trim();
const taskCode = it => `${it.series || 'T'}-${String(it.no).padStart(4, '0')}`;
const dayToDate = day => { const [y, m, d] = day.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (day, n) => { const d = dayToDate(day); d.setDate(d.getDate() + n); return dayOf(d); };
const dayMonth = day => { const [, m, d] = day.split('-'); return `${d}/${m}`; };
const weekday = day => new Intl.DateTimeFormat('en-GB', { weekday: 'short' }).format(dayToDate(day));
const isDay = v => /^\d{4}-\d{2}-\d{2}$/.test(v) && v >= '2000-01-01' && v <= '2999-12-31';
const BELL = '<svg class="bell" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8c-2.4 0-4 1.8-4 4.2 0 3-1.4 4.3-1.4 5h10.8c0-.7-1.4-2-1.4-5 0-2.4-1.6-4.2-4-4.2z"/><path d="M6.6 13.4a1.5 1.5 0 0 0 2.8 0"/></svg>';
const TICK = '<svg class="tk" viewBox="0 0 16 12" aria-hidden="true"><path d="M1.5 6.4c1.4 1.2 2.7 2.6 3.9 4.2 2.3-3.9 5.3-6.9 9.2-9"/></svg>';

/* =====================================================================
   2. Data model
   Items form a tree: a task (parentId null) has sub-tasks, which can have
   their own. Tasks are stored once; the daily plan is a view for a date.
   ===================================================================== */
let db = null;
let byId = new Map();     // id -> item (not removed)
let kidsOf = new Map();   // parent id, or 'S:' + section id -> ordered children
let remOf = new Map();    // item id -> its reminders still to come or awaiting an answer, soonest first

/* Sections come in three kinds. Each kind has its own daily 1, 2, 3 numbering and its own series of permanent IDs.
   Personal and Procurement Cases are always on the DAP and cannot be removed. Personal is left out of handover notes. */
const SERIES = { work: 'T', personal: 'P', procurement: 'PC' };
const FIXED = [{ id: 'sec-procurement', kind: 'procurement', name: 'Procurement Cases' }, { id: 'sec-personal', kind: 'personal', name: 'Personal' }];

function newDb() {
  const t = nowIso();
  return tidy({
    app: APP, schema: SCHEMA,
    meta: { id: uid(), createdAt: t, savedAt: t, next: { T: 1, P: 1, PC: 1 } },
    settings: { showDoneSteps: true },
    sections: [{ id: uid(), name: 'General', kind: 'work', order: 0, removed: false, createdAt: t, updatedAt: t }],
    items: [],
    sets: [{ id: uid(), name: 'Approval', steps: ['ST', 'PM', 'EM', 'AM'], updatedAt: t }],
    reminders: [], rotations: [], log: []
  });
}

function tidy(d) {            // bring any saved plan, including one from an earlier version, up to the current shape
  const t = nowIso();
  d.meta = d.meta || {};
  if (!d.meta.id) d.meta.id = uid();
  if (!d.meta.createdAt) d.meta.createdAt = t;
  if (!d.meta.savedAt) d.meta.savedAt = t;
  d.meta.next = Object.assign({ T: d.meta.nextNo || 1, P: 1, PC: 1 }, d.meta.next || {});
  delete d.meta.nextNo;
  d.settings = Object.assign({ showDoneSteps: true, notify: true, repeatReminders: true, compact: false, printPersonal: true }, d.settings || {});
  if (!Array.isArray(d.reminders)) d.reminders = [];
  const monthAgo = new Date(Date.now() - 30 * 864e5).toISOString();       // answered reminders are kept a month, then dropped
  d.reminders = d.reminders.filter(r => r && r.id && r.itemId && r.at && (r.state === 'pending' || r.state === 'due' || (r.updatedAt || r.at) > monthAgo));
  for (const k of ['sections', 'items', 'reminders', 'rotations', 'handovers', 'log']) if (!Array.isArray(d[k])) d[k] = [];
  if (!Array.isArray(d.sets)) d.sets = [{ id: uid(), name: 'Approval', steps: ['ST', 'PM', 'EM', 'AM'], updatedAt: t }];
  for (const s of d.sets) { if (s.for !== 'task') s.for = 'step'; s.regex = !!s.regex; if (!Array.isArray(s.steps)) s.steps = []; if (typeof s.name !== 'string') s.name = ''; }
  for (const s of d.sections) { if (!s.kind) s.kind = 'work'; if (s.collapsed === undefined) s.collapsed = false; }
  let top = Math.max(-1, ...d.sections.map(s => s.order));
  for (const f of FIXED) {
    let s = d.sections.find(x => x.id === f.id);
    if (!s) { s = { id: f.id, order: ++top, createdAt: t, updatedAt: t }; d.sections.push(s); }
    s.kind = f.kind; s.name = f.name; s.removed = false;
  }
  for (const it of d.items) { if (!it.parentId && !it.series) it.series = 'T'; if (it.deferUntil === undefined) it.deferUntil = null; }
  d.app = APP; d.schema = SCHEMA;
  return d;
}

function buildIndex() {
  byId = new Map(); kidsOf = new Map();
  for (const it of db.items) {
    if (it.removed) continue;
    byId.set(it.id, it);
    const k = it.parentId || 'S:' + it.sectionId;
    if (!kidsOf.has(k)) kidsOf.set(k, []);
    kidsOf.get(k).push(it);
  }
  for (const list of kidsOf.values()) list.sort((a, b) => a.order - b.order || (a.createdAt < b.createdAt ? -1 : 1));
  remOf = new Map();
  for (const r of db.reminders) {
    if (r.state !== 'pending' && r.state !== 'due') continue;
    if (!remOf.has(r.itemId)) remOf.set(r.itemId, []);
    remOf.get(r.itemId).push(r);
  }
  for (const list of remOf.values()) list.sort((a, b) => a.at < b.at ? -1 : 1);
  buildView();
}
const kids = id => kidsOf.get(id) || [];
const tasksIn = sectionId => kidsOf.get('S:' + sectionId) || [];
const liveSections = () => db.sections.filter(s => !s.removed).sort((a, b) => a.order - b.order);
const hasContent = d => d.items.some(i => !i.removed);

/* ---- the day being shown ----
   ui.day is the real today; ui.view is the day on screen. For a past day, each item's state is
   worked out from the change log as it stood at the end of that day. */
const mode = () => ui.view === ui.day ? 'today' : ui.view < ui.day ? 'past' : 'future';
const eventDay = e => e.d || dayOf(new Date(e.t));
const STATUS_OF = { done: 'done', strike: 'cancelled', reopen: 'open' };
const byDayThenTime = (a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.e.t < b.e.t ? -1 : a.e.t > b.e.t ? 1 : 0;
function replay(list) {                 // list: one item's events, oldest first
  const s = { status: 'open', statusDay: null, statusAt: null, deferUntil: null };
  for (const { e, d } of list) {
    if (e.e === 'defer') { s.deferUntil = e.v || null; continue; }
    const ns = STATUS_OF[e.e]; if (!ns || ns === s.status) continue;
    s.status = ns; s.statusDay = ns === 'open' ? null : d; s.statusAt = ns === 'open' ? null : e.t;
  }
  return s;
}
function eventsFor(id, upto) {
  return db.log.filter(e => e.id === id && (STATUS_OF[e.e] || e.e === 'defer')).map(e => ({ e, d: eventDay(e) })).filter(x => !upto || x.d <= upto).sort(byDayThenTime);
}
let asOf = null;                        // id -> state at the end of the past day on screen
function buildView() {
  asOf = null; if (mode() !== 'past') return;
  const per = new Map();
  for (const e of db.log) {
    if (!(STATUS_OF[e.e] || e.e === 'defer')) continue;
    const d = eventDay(e); if (d > ui.view) continue;
    if (!per.has(e.id)) per.set(e.id, []);
    per.get(e.id).push({ e, d });
  }
  asOf = new Map();
  for (const [id, list] of per) asOf.set(id, replay(list.sort(byDayThenTime)));
}
const STILL_OPEN = Object.freeze({ status: 'open', statusDay: null, statusAt: null, deferUntil: null });
const st = it => asOf ? (asOf.get(it.id) || STILL_OPEN) : it;
const existed = it => it.createdDay <= ui.view;

/* What appears on the DAP for the day on screen */
const taskShown = it => { if (!existed(it)) return false; const s = st(it); return s.status === 'open' || s.statusDay === ui.view; };
const stepShown = it => { if (!existed(it)) return false; const s = st(it); return s.status === 'open' || s.statusDay === ui.view || (s.status === 'done' && db.settings.showDoneSteps); };
const isLater = it => { const s = st(it); return s.status === 'open' && !!s.deferUntil && s.deferUntil > ui.view; };
const planStart = () => { let s = dayOf(new Date(db.meta.createdAt)); for (const it of db.items) if (it.createdDay && it.createdDay < s) s = it.createdDay; return s; };

function ancestors(it) { const chain = []; let cur = it; while (cur) { chain.unshift(cur); cur = cur.parentId ? byId.get(cur.parentId) : null; } return chain; }
function descendants(id) { const out = []; const walk = p => { for (const k of kids(p)) { out.push(k); walk(k.id); } }; walk(id); return out; }
function logEvent(id, e, v, day) { const entry = { t: nowIso(), d: day || today(), id, e }; if (v !== undefined && v !== null) entry.v = v; db.log.push(entry); }

/* =====================================================================
   3. Saving: a data file in the chosen folder, plus a copy in the browser
   ===================================================================== */
const store = { state: 'none', parent: null, dir: null, file: null, lastSaved: null, error: null, writing: false, again: false, note: null, pendingFile: null };
// state: none | unsupported | locked | connected | choice
let saveTimer = null;

function save() {
  db.meta.savedAt = nowIso();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 250);
  syncSoon();
}
function mirrorNow() {
  const text = JSON.stringify(db);
  idbSet('mirror', text).catch(() => { });          // the browser's own copy; IndexedDB has room for a plan of any size
  try { localStorage.setItem(MIRROR_KEY, text); return true; } catch (e) { try { localStorage.removeItem(MIRROR_KEY); } catch (e2) { } return false; }
}
function flush() { clearTimeout(saveTimer); saveTimer = null; if (db && sync.st) stampChanges(); mirrorNow(); writeFile(); scheduleAlarms(); }

async function writeFile() {
  if (store.state !== 'connected' || !store.file) { renderStatus(); return; }
  if (store.writing) { store.again = true; return; }
  store.writing = true;
  try {
    const w = await store.file.createWritable();
    await w.write(JSON.stringify(db, null, 1));
    await w.close();
    store.lastSaved = new Date(); const hadError = !!store.error; store.error = null;
    if (hadError) requestRender();
  } catch (e) {
    const first = !store.error; store.error = e && e.message ? e.message : String(e);
    if (first) requestRender();
  }
  store.writing = false;
  renderStatus();
  if (store.again) { store.again = false; writeFile(); }
}

/* a tiny key-value store for remembering the chosen folder between visits */
function idb() { return new Promise((ok, no) => { const q = indexedDB.open('dap-app', 1); q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); }); }
async function idbGet(k) { const d = await idb(); return new Promise((ok, no) => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
async function idbSet(k, v) { const d = await idb(); return new Promise((ok, no) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => ok(); t.onerror = () => no(t.error); }); }

async function chooseFolder() {
  let parent;
  try { parent = await window.showDirectoryPicker({ id: 'dap-data', mode: 'readwrite' }); } catch (e) { return; }  // cancelled
  await connect(parent, true);
}

async function connect(parent, fresh) {
  store.note = null;
  let dir, file, text;
  try {
    dir = parent.name === DATA_DIR ? parent : await parent.getDirectoryHandle(DATA_DIR, { create: true });
    file = await dir.getFileHandle(DATA_FILE, { create: true });
    text = await (await file.getFile()).text();
  } catch (e) {
    store.state = 'none';
    store.note = 'The data folder could not be opened (' + (e.message || e.name) + '). Choose it again.';
    render(); return;
  }
  let fromFile = null;
  if (text.trim()) {
    try { fromFile = JSON.parse(text); } catch (e) { fromFile = undefined; }
    if (!fromFile || fromFile.app !== APP) {
      store.state = 'none';
      store.note = 'The file ' + DATA_FILE + ' in that folder could not be read as a plan, so it was left untouched. Choose another folder, or restore a copy from the backups folder.';
      render(); return;
    }
  }
  store.parent = parent; store.dir = dir; store.file = file;
  if (fromFile && fromFile.schema !== SCHEMA) await keepCopyOf(JSON.parse(text), 'before-update');
  try { await idbSet('parent', parent); } catch (e) { /* the folder will be asked for again next time */ }

  if (fromFile) {
    const sameplan = fromFile.meta && fromFile.meta.id === db.meta.id;
    if (!sameplan && hasContent(db) && hasContent(fromFile)) {   // two different plans: ask
      store.pendingFile = fromFile; store.state = 'choice'; render(); return;
    }
    const browserIsNewer = sameplan && db.meta.savedAt > fromFile.meta.savedAt;
    if (!browserIsNewer && (sameplan || hasContent(fromFile) || !hasContent(db))) db = tidy(fromFile);
  }
  await finishConnect();
}

async function finishConnect() {
  store.state = 'connected'; store.pendingFile = null; store.error = null;
  undoStack.length = 0; redoStack.length = 0; stampReset();
  await backupToday();
  mirrorNow();
  await writeFile();
  render();
}

async function backupToday() {      // one dated copy per day, taken before the day's first change
  if (!store.dir) return;
  try {
    const b = await store.dir.getDirectoryHandle(BACKUP_DIR, { create: true });
    const name = `dap-data ${today()}.json`;
    let exists = true;
    try { await b.getFileHandle(name); } catch (e) { exists = false; }
    if (!exists && hasContent(db)) {
      const w = await (await b.getFileHandle(name, { create: true })).createWritable();
      await w.write(JSON.stringify(db, null, 1)); await w.close();
    }
    const names = [];
    for await (const [n, h] of b.entries()) if (h.kind === 'file' && /^dap-data \d{4}-\d{2}-\d{2}\.json$/.test(n)) names.push(n);
    names.sort();
    while (names.length > BACKUPS_KEPT) await b.removeEntry(names.shift());
  } catch (e) { /* a missed backup must never block the plan */ }
}

async function keepCopyOf(obj, label) {   // used before one plan replaces another
  try {
    const b = await store.dir.getDirectoryHandle(BACKUP_DIR, { create: true });
    const stamp = nowIso().replace(/[:.]/g, '-');
    const w = await (await b.getFileHandle(`${label} ${stamp}.json`, { create: true })).createWritable();
    await w.write(JSON.stringify(obj, null, 1)); await w.close();
  } catch (e) { }
}

function downloadCopy() {
  flush();
  const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' }), name = `dap-data copy ${today()}.json`;
  if (NATIVE) shareFile(blob, name).catch(e => { ui.importError = 'The copy could not be shared (' + (e.message || e) + ').'; render(); });
  else downloadBlob(blob, name);
}

const ui = { day: today(), view: today(), q: '', printing: false, menuId: null, remError: null, ho: null, drawerId: null, confirmRemove: null, dialog: null, refocus: null, importDb: null, importError: null, second: false };
const undoStack = [], redoStack = [];

function pushUndo(snapshot) { undoStack.push(snapshot || JSON.stringify(db)); if (undoStack.length > 60) undoStack.shift(); redoStack.length = 0; }      // a fresh change ends the chance to redo
function change(fn, opts) { pushUndo(); fn(); save(); if (opts && opts.defer) requestRender(); else render(); }
function restore(json) { db = JSON.parse(json); ui.menuId = null; ui.confirmRemove = null; save(); render(); }
function undo() { if (!undoStack.length) return; redoStack.push(JSON.stringify(db)); restore(undoStack.pop()); }
function redo() { if (!redoStack.length) return; undoStack.push(JSON.stringify(db)); restore(redoStack.pop()); }

function nextOrder(key) { let m = -1; for (const it of db.items) if ((it.parentId || 'S:' + it.sectionId) === key && it.order > m) m = it.order; return m + 1; }
function makeItem(parentId, sectionId, title, deferUntil) {
  const t = nowIso();
  const it = { id: uid(), parentId: parentId || null, sectionId: parentId ? null : sectionId, series: null, no: null, title, note: '', status: 'open', statusAt: null, statusDay: null,
    order: nextOrder(parentId || 'S:' + sectionId), createdAt: t, createdDay: today(), updatedAt: t, deferUntil: deferUntil || null, hoHeading: '', hoText: '', removed: false };
  if (!parentId) {
    const sec = db.sections.find(s => s.id === sectionId);
    it.series = SERIES[sec ? sec.kind : 'work'] || 'T';
    it.no = db.meta.next[it.series]++;
  }
  db.items.push(it); logEvent(it.id, 'add');
  if (deferUntil) logEvent(it.id, 'defer', deferUntil);

}
/* Sets: a name (or a pattern) and the items to add beneath anything given that name.
   'task' sets add sub-tasks to a new task; 'step' sets add smaller steps to a new sub-task.
   A pattern is a regular expression, matched ignoring capitals. The first matching set is used. */
function validPattern(text) { try { new RegExp(text, 'i'); return true; } catch (e) { return false; } }
function findSet(kind, title) {
  for (const s of db.sets) {
    if (s.for !== kind) continue;
    const n = s.name.trim(); if (!n || !s.steps.length) continue;
    if (s.regex) { try { if (new RegExp(n, 'i').test(title)) return s; } catch (e) { /* a broken pattern matches nothing */ } }
    else if (n.toLowerCase() === title.toLowerCase()) return s;

}
function makeStepWithSet(parentId, title) {
  const step = makeItem(parentId, null, title);
  const set = findSet('step', title);

  return step;
}
function addTask(sectionId, title, opts) {      // on a day ahead, the new task is scheduled for that day
  const m = mode(); if (m === 'past') return;
  change(() => {
    const task = makeItem(null, sectionId, title, m === 'future' ? ui.view : null);
    const set = findSet('task', title);
    if (set) for (const name of set.steps) makeStepWithSet(task.id, name);
  }, opts);
}
function addStep(parentId, title, opts) {
  if (mode() !== 'today') return;
  change(() => makeStepWithSet(parentId, title), opts);
}
function setStatus(id, status) {
  const it = byId.get(id), m = mode(); if (!it || m === 'future' || st(it).status === status) return;
  const ev = status === 'done' ? 'done' : status === 'cancelled' ? 'strike' : 'reopen';
  change(() => {
    it.updatedAt = nowIso();
    if (m === 'today') {
      it.status = status;
      it.statusAt = status === 'open' ? null : it.updatedAt;
      it.statusDay = status === 'open' ? null : today();
      logEvent(id, ev);
    } else {                            // on a past day: record it against that day, then work out where the item stands now
      logEvent(id, ev, undefined, ui.view);
      const now = replay(eventsFor(id));
      it.status = now.status; it.statusDay = now.statusDay; it.statusAt = now.statusAt;
    }

}
function setDefer(id, day) {            // move to a later day, or back to today with day = null
  const it = byId.get(id); if (!it || mode() !== 'today') return;
  if (day && day <= ui.day) day = null;
  if ((it.deferUntil || null) === day) return;
  change(() => { it.deferUntil = day; it.updatedAt = nowIso(); logEvent(id, 'defer', day); });
}
function removeItem(id) {
  const it = byId.get(id); if (!it || mode() !== 'today') return;
  change(() => {
    const t = nowIso();
    for (const x of [it, ...descendants(id)]) { x.removed = true; x.updatedAt = t; }
    logEvent(id, 'remove');
    ui.confirmRemove = null;
    if (ui.drawerId && (ui.drawerId === id || !db.items.some(x => x.id === ui.drawerId && !x.removed))) ui.drawerId = it.parentId || null;
  });
}
function moveTask(id, sectionId, beforeId) {
  const it = byId.get(id); if (!it || it.parentId || mode() !== 'today') return;
  change(() => {
    const list = tasksIn(sectionId).filter(x => x.id !== id);
    let at = beforeId ? list.findIndex(x => x.id === beforeId) : -1; if (at < 0) at = list.length;
    list.splice(at, 0, it);
    const t = nowIso();
    if (it.sectionId !== sectionId) { it.sectionId = sectionId; logEvent(id, 'move', sectionId); }
    list.forEach((x, i) => { if (x.order !== i) { x.order = i; x.updatedAt = t; } });
    it.updatedAt = t;
  });
}
function moveStep(id, parentId, beforeId) {      // put a sub-task under another task (or reorder it within its own)
  const it = byId.get(id), parent = byId.get(parentId);
  if (!it || !parent || !it.parentId || parent.parentId || mode() !== 'today') return;
  if (it.parentId === parentId && !beforeId && kids(parentId)[kids(parentId).length - 1] === it) return;
  change(() => {
    const list = kids(parentId).filter(x => x.id !== id);
    let at = beforeId ? list.findIndex(x => x.id === beforeId) : -1; if (at < 0) at = list.length;
    list.splice(at, 0, it);
    const t = nowIso();
    if (it.parentId !== parentId) { it.parentId = parentId; logEvent(id, 'move', parentId); }
    list.forEach((x, i) => { if (x.order !== i) { x.order = i; x.updatedAt = t; } });
    it.updatedAt = t;

}
function promoteStep(id, sectionId) {            // a sub-task becomes a task of its own, at the end of a section
  const it = byId.get(id), sec = db.sections.find(x => x.id === sectionId && !x.removed);
  if (!it || !sec || !it.parentId || mode() !== 'today') return;
  change(() => {
    const hadSteps = kids(id).length > 0;
    it.parentId = null; it.sectionId = sectionId;
    const series = SERIES[sec.kind] || 'T';
    if (!(it.no && it.series === series)) { it.series = series; it.no = db.meta.next[series]++; }      // a former task returning to its own kind of section gets its old ID back
    it.order = nextOrder('S:' + sectionId); it.updatedAt = nowIso();
    logEvent(id, 'promote', sectionId);
    if (!hadSteps) { const set = findSet('task', it.title); if (set) for (const name of set.steps) makeStepWithSet(id, name); }
  });
}
function demoteTask(id, parentId, beforeId) {     // a task becomes a sub-task of another task; its own sub-tasks go with it
  const it = byId.get(id), parent = byId.get(parentId);
  if (!it || !parent || it.parentId || parent.parentId || id === parentId || mode() !== 'today') return;
  change(() => {
    const list = kids(parentId).filter(x => x.id !== id);
    let at = beforeId ? list.findIndex(x => x.id === beforeId) : -1; if (at < 0) at = list.length;
    list.splice(at, 0, it);
    const t = nowIso();
    it.parentId = parentId; it.sectionId = null; it.updatedAt = t;      // its permanent ID stays on record, in case it is made a task again
    list.forEach((x, i) => { if (x.order !== i || x === it) { x.order = i; x.updatedAt = t; } });
    logEvent(id, 'demote', parentId);
  });
}
function nudgeTask(id, dir) {       // Alt + arrow keys: swap places with the neighbour shown above or below
  const it = byId.get(id); if (!it || it.parentId || mode() !== 'today') return;
  const shown = tasksIn(it.sectionId).filter(x => taskShown(x) && !isLater(x)).sort(urgentFirst);
  const i = shown.findIndex(x => x.id === id), j = i + dir;
  if (i < 0 || j < 0 || j >= shown.length || !!shown[j].urgent !== !!it.urgent) return;      // urgent tasks stay above the rest
  ui.refocus = `.row[data-id="${id}"] .title`;
  change(() => { const o = it.order, t = nowIso(); it.order = shown[j].order; shown[j].order = o; it.updatedAt = shown[j].updatedAt = t; });
}
const urgentFirst = (a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0);
function setUrgent(id, on) {
  const it = byId.get(id); if (!it || it.parentId || mode() !== 'today') return;
  const v = on === undefined ? !it.urgent : !!on; if (!!it.urgent === v) return;

function taskText(t) { let x = taskCode(t).toLowerCase() + ' ' + itemText(t); for (const d of descendants(t.id)) x += ' ' + itemText(d); return x; }
let searchTerms = null;                 // the words being searched for, while a search is on

function addSection() {             // a new section goes after the last ordinary one, ahead of any permanent sections that follow
  if (mode() !== 'today') return;

/* ---- handover notes ----
   Built for any period chosen at the time. Included: every task outside Personal that was still open at the end
   of the period, or was ticked or struck out during it. Each task is reported under its handover heading; without
   one, Procurement Cases tasks go together under "Indents/Approvals" and any other task gets a heading of its own.
   Each task is reported as Completed and Pending. A task's own handover status is used as written, with lines placed
   under "Completed:" and "Pending:" going under those sub-headings; otherwise both are drafted from its sub-tasks. */
const HO_PROCUREMENT_HEADING = 'Indents/Approvals';
const dashDate = day => { const [y, m, d] = day.split('-'); return `${d}-${m}-${y.slice(2)}`; };
const sentence = t => { t = String(t).trim(); return !t || /[.!?:;)]$/.test(t) ? t : t + '.'; };
const stateAt = (it, day) => day >= ui.day ? it : replay(eventsFor(it.id, day));       // how an item stood at the end of a day

function draftReport(t, s, to) {     // drafted from the DAP: sub-task by sub-task, what is completed and what is pending
  const r = { general: [], completed: [], pending: [] };
  if (t.note.trim()) r.general.push(sentence(oneLine(t.note)));
  for (const k of kids(t.id)) {
    if (k.createdDay > to) continue;
    const ks = stateAt(k, to), note = k.note.trim() ? ' ' + sentence(oneLine(k.note)) : '';
    if (ks.status === 'done') { r.completed.push(sentence(k.title) + note); continue; }           // no dates on completed sub-tasks (AB's choice)
    if (ks.status === 'cancelled') { r.completed.push(`${k.title}: not required.${note}`); continue; }
    const done = [], pending = [];          // a part-done sub-task is split: its ticked smaller steps under Completed, the rest under Pending
    for (const x of kids(k.id)) { if (x.createdDay > to) continue; const xs = stateAt(x, to); if (xs.status === 'done') done.push(x.title); else if (xs.status === 'open') pending.push(x.title); }
    if (done.length) r.completed.push(`${k.title}: ${done.join(', ')}.`);
    let line = pending.length ? `${k.title}: ${pending.join(', ')}` : k.title;
    if (ks.deferUntil && ks.deferUntil > to) line += `, to be taken up from ${shortDate(ks.deferUntil)}`;
    r.pending.push(line + '.' + note);
  }
  if (s.status === 'done') r.completed.push('Completed.');                              // no completion date (AB's choice)
  else if (s.status === 'cancelled') r.general.push('No longer required.');                  // no date or mention of striking out (AB's choice)
  else if (s.deferUntil && s.deferUntil > to) r.pending.push(`To be taken up from ${shortDate(s.deferUntil)}.`);
  else if (!r.completed.length && !r.pending.length) r.pending.push('No progress recorded yet.');
  return r;
}
function parseOwn(text) {            // a written status: lines after "Completed:" or "Pending:" go under that sub-heading
  const r = { general: [], completed: [], pending: [] }; let cur = r.general;
  for (const raw of text.split('\n')) {
    const line = raw.trim(); if (!line) continue;
    const m = line.match(/^(completed|pending)\s*(?::\s*(.*))?$/i);       // "Completed", "Completed:" or "Completed: text"; not "Pending approval"
    if (m) { cur = r[m[1].toLowerCase()]; if (m[2] && m[2].trim()) cur.push(m[2].trim()); continue; }
    cur.push(line);
  }
  return r;
}
const taskReport = (t, s, to) => (t.hoText || '').trim() ? parseOwn(t.hoText) : draftReport(t, s, to);
function reportText(r) {             // the same thing as text for the status box, ready to edit
  const out = [...r.general];
  if (r.completed.length) out.push('Completed:', ...r.completed);
  if (r.pending.length) out.push('Pending:', ...r.pending);
  return out.join('\n');
}
function handoverModel(from, to) {    // -> [{ heading, shared, entries: [{ title, general, completed, pending }] }]
  const groups = [], byKey = new Map();
  for (const sec of liveSections()) {
    if (sec.kind === 'personal') continue;
    for (const t of tasksIn(sec.id)) {
      if (t.createdDay > to) continue;
      const s = stateAt(t, to);
      if (s.status !== 'open' && !(s.statusDay >= from && s.statusDay <= to)) continue;       // closed before the period began
      const named = (t.hoHeading || '').trim(), procurement = sec.kind === 'procurement';
      const alone = !named && !procurement;
      const heading = named || (procurement ? HO_PROCUREMENT_HEADING : t.title);
      const key = alone ? 'task:' + t.id : 'heading:' + heading.toLowerCase();
      let g = byKey.get(key);
      if (!g) { g = { heading, shared: !alone, entries: [], lead: heading.toLowerCase() === HO_PROCUREMENT_HEADING.toLowerCase() }; byKey.set(key, g); groups.push(g); }
      g.entries.push(Object.assign({ title: t.title }, taskReport(t, s, to)));     // under a shared heading each task gets its own bold sub-heading
    }
  }
  return groups.sort((a, b) => (b.lead ? 1 : 0) - (a.lead ? 1 : 0));        // Indents/Approvals first, as in the paper notes; the rest in DAP order
}

/* The Word file is written here directly: a .docx is a zip of a few XML files. Format follows the paper notes:
   A4, Calibri, centred 16 pt bold underlined title, 12 pt bold underlined headings, numbered 12 pt points. */
const xmlEsc = t => String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function docxParts(groups) {
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"', HEAD = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const run = (text, props) => `<w:r><w:rPr>${props}</w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r>`;
  const blank = '<w:p><w:pPr><w:spacing w:after="0" w:line="276" w:lineRule="auto"/><w:rPr><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:pPr></w:p>';
  let body = `<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>${run('Handing/Taking Over Notes', '<w:b/><w:sz w:val="32"/><w:szCs w:val="32"/><w:u w:val="single"/>')}</w:p>${blank}${blank}`;
  const SZ = '<w:sz w:val="24"/><w:szCs w:val="24"/>';
  let lists = 0;                       // every numbered list is its own numbering instance, so each one starts at 1
  const para = (text, o) => `<w:p><w:pPr>${o.num ? `<w:pStyle w:val="ListParagraph"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="${o.num}"/></w:numPr>` : ''}${o.keep ? '<w:keepNext/>' : ''}<w:spacing w:before="${o.before || 0}" w:after="${o.after || 0}" w:line="276" w:lineRule="auto"/><w:ind w:left="${o.left || 0}"${o.num ? ' w:hanging="360"' : ''}/></w:pPr>${run(text, o.props || SZ)}</w:p>`;

        <span class="stab${fixed ? ' fixed' : ''}">${tab}</span>
        ${fixed || !edit
          ? `<span class="sname">${esc(s.name || 'Unnamed section')}</span>`
          : `<span class="sname" contenteditable="plaintext-only" spellcheck="false" data-edit="name" data-sid="${s.id}" aria-label="Section name">${esc(s.name)}</span>`}
        <span class="scount">${all.length ? plural(nOpen, 'open task', 'open tasks') + (waiting.length ? `, ${waiting.length} for later` : '') : ''}${folded ? (all.length ? ', folded' : 'Folded') : ''}</span>
        ${edit ? `<span class="sact">
          <button class="btn quiet" data-act="sec-up" data-sid="${s.id}" ${i === 0 ? 'disabled' : ''} aria-label="Move section up" title="Move section up">&#8593;</button>
          <button class="btn quiet" data-act="sec-down" data-sid="${s.id}" ${i === sections.length - 1 ? 'disabled' : ''} aria-label="Move section down" title="Move section down">&#8595;</button>
          ${fixed ? '' : `<button class="btn quiet" data-act="sec-remove" data-sid="${s.id}" ${all.length ? 'disabled' : ''} title="${all.length ? 'Move its tasks out first' : 'Remove this empty section'}">Remove</button>`}
        </span>` : ''}
      </div>
      ${folded ? '' : `
      ${rows.map(([t, n]) => rowHtml(t, n)).join('')}
      ${wait.length ? `<div class="latercap">Later</div>${wait.map(t => rowHtml(t, null)).join('')}` : ''}
      ${searchTerms ? '' : m === 'past'
        ? (all.length ? '' : `<p class="none">Nothing here that day.</p>`)
        : `<div class="addwrap"><input class="addtask" data-add="task" data-section="${s.id}" placeholder="${m === 'future' ? `Add a task for ${shortDate(ui.view)}, then press Enter` : 'Add a task, then press Enter'}" aria-label="Add a task to ${esc(label)}" autocomplete="off">${edit ? `<div class="dropzone">Drop here to make it a task in ${esc(s.name || 'this section')}</div>` : ''}</div>`}`}
    </section>`;
  }).join('');

  const counts = [plural(open, 'open task', 'open tasks')];
  if (personal) counts.push(`${personal} personal`);
  if (done) counts.push(`${done} ticked`);
  if (struck) counts.push(`${struck} struck out`);
  if (later) counts.push(`${later} for later`);

  return `<div class="wrap"><main class="sheet ${m}">
    <header class="top">
      <div>
        <h1><span>Daily Action Plan</span><span class="date">${shortDate(ui.view)}</span></h1>
        <p class="sub">${esc(longDate(ui.view))}. ${counts.join(', ')}.</p>
      </div>
      <div class="tools">
        <div class="btns">
          <button class="btn" data-act="handover">Handover notes</button>
          ${NATIVE ? '' : '<button class="btn" data-act="print">Print</button>'}
          <button class="btn" data-act="settings">Settings</button>
        </div>
      </div>
    </header>
    <div class="bar">
      <input id="q" type="search" class="qbox" value="${esc(ui.q)}" placeholder="${NATIVE ? 'Search tasks' : 'Search tasks  ( / )'}" aria-label="Search tasks" autocomplete="off" spellcheck="false">
      <button class="btn ur" data-act="undo" ${undoStack.length ? '' : 'disabled'} title="Undo (Ctrl + Z)" aria-label="Undo"><span class="urk" aria-hidden="true">&#8630;</span><span class="urt">Undo</span></button>
      <button class="btn ur" data-act="redo" ${redoStack.length ? '' : 'disabled'} title="Redo (Ctrl + Y)" aria-label="Redo"><span class="urk" aria-hidden="true">&#8631;</span><span class="urt">Redo</span></button>
      <div class="status"><span id="savestate"></span><span id="syncstate" hidden></span></div>
    </div>
    ${daysHtml()}
    ${foundHtml(onScreen)}
    ${noticeHtml()}
    ${body}
    ${edit && !searchTerms ? `<button class="btn addsection" data-act="add-section">Add a section</button>` : ''}
    ${NATIVE ? TOUCH_KEY : ''}<p class="key"${NATIVE ? ' hidden' : ''}><b>Mouse:</b> click a step or a task box to tick it; <b>Shift + click</b> strikes it out; <b>right-click</b> a step for notes, smaller steps, a later date or a reminder; <b>drag</b> a step onto another task, or onto a section's Add box to make it a task; <b>drag</b> a task by its left edge to move it, or onto another task's steps to make it a step of that task. The <b>&#9662;</b> beside a section folds it away.<br>
      <b>Keyboard:</b> <b>arrow keys</b> move between tasks and along their steps; <b>Space</b> ticks, <b>Delete</b> strikes out, <b>Enter</b> opens details, <b>U</b> marks a task urgent; <b>Alt + arrow keys</b> move a task; <b>/</b> searches; <b>Ctrl + left or right arrow</b> shows the day before or after; <b>Ctrl + Z</b> undoes and <b>Ctrl + Y</b> redoes.</p>
  </main></div>
  ${ui.drawerId && !ui.printing ? drawerHtml() : ''}
  ${sync.pendingPlan ? planChoiceHtml() : store.state === 'choice' ? choiceHtml() : ui.dialog === 'settings' ? settingsHtml() : ui.dialog === 'handover' ? handoverHtml() : ui.dialog === 'print' ? printHtml() : ''}`;
}

function foundHtml(onScreen) {          // while searching: how many matches here, and matches on other days
  if (!searchTerms) return '';
  const here = onScreen.size;
  const elsewhere = db.items.filter(t => !t.removed && !t.parentId && !onScreen.has(t.id) && hitTask(t))
    .map(t => {
      const when = t.status === 'done' ? `ticked ${shortDate(t.statusDay)}` : t.status === 'cancelled' ? `struck out ${shortDate(t.statusDay)}` : t.createdDay > ui.view ? `added ${shortDate(t.createdDay)}` : 'open';
      return { t, when, key: t.statusDay || t.createdDay || '' };
    }).sort((a, b) => a.key < b.key ? 1 : a.key > b.key ? -1 : 0);
  return `<div class="found" role="status"><p>${here ? `<b>${here}</b> ${here === 1 ? 'task' : 'tasks'} on this DAP match` : 'Nothing on this DAP matches'} &ldquo;${esc(ui.q.trim())}&rdquo;.<button class="btn" data-act="q-clear">Clear search</button></p>
    ${elsewhere.length ? `<p style="margin-top:8px">On other days${elsewhere.length > 40 ? ' (the latest 40)' : ''}:</p><ul>${elsewhere.slice(0, 40).map(({ t, when }) => `<li><button data-act="goto-task" data-id="${t.id}"><span class="fid">${taskCode(t)}</span>${esc(t.title)}</button><span class="when">${when}</span></li>`).join('')}</ul>` : ''}</div>`;
}

function daysHtml() {
  const start = planStart();
  // seven days at most: the day on screen with four before it and two after, moved along so nothing before the plan's first day is shown
  let from = addDays(ui.view, -4);
  if (from < start) from = start < ui.view ? start : ui.view;
  const to = addDays(from, 6);
  const chips = [];
  for (let d = from; d <= to; d = addDays(d, 1)) {
    chips.push(`<button class="daybtn${d === ui.view ? ' on' : ''}${d === ui.day ? ' now' : ''}" data-act="go-day" data-day="${d}" title="${esc(longDate(d))}${d === ui.day ? ' (today)' : ''}" ${d === ui.view ? 'aria-current="date"' : ''}><span>${d === ui.day ? 'Today' : weekday(d)}</span><b class="df">${dayMonth(d)}</b><b class="ds">${+d.slice(8)}</b></button>`);
  }
  return `<nav class="days" aria-label="Other days">
    <div class="dayrow">
    <button class="btn quiet dayarrow" data-act="go-day" data-day="${addDays(ui.view, -1)}" aria-label="Previous day" title="Previous day (Ctrl + Left)">&#8249;</button>
    <div class="daystrip">${chips.join('')}</div>
    <button class="btn quiet dayarrow" data-act="go-day" data-day="${addDays(ui.view, 1)}" aria-label="Next day" title="Next day (Ctrl + Right)">&#8250;</button>
    <span class="pickwrap"><button class="btn pickbtn" data-act="pick-date" title="Go to any date" aria-label="Other date"><svg class="cal" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 6h13M5 1v3M11 1v3" stroke="currentColor" stroke-width="1.4" fill="none"/></svg><span class="pktext">Other date</span></button><input type="date" class="daypick" data-change="goto-day" value="${ui.view}" tabindex="-1" aria-label="Go to a date"></span>
    </div>
    <button class="tog" role="switch" aria-checked="${!!db.settings.showDoneSteps}" data-act="toggle-done-steps" title="On: sub-tasks ticked on earlier days stay on the DAP for as long as their task is still open. Off: only today's ticks are shown.">Show earlier ticked sub-tasks<span class="sw" aria-hidden="true"></span></button>
    <button class="tog" role="switch" aria-checked="${!!db.settings.compact}" data-act="toggle-compact" title="Tighter rows, to fit more tasks on screen">Compact<span class="sw" aria-hidden="true"></span></button>
  </nav>`;
}

function noticeHtml() {
  let out = '';
  const m = mode();
  if (m === 'past') out += `<div class="notice day"><p>This is the DAP of ${esc(longDate(ui.view))}, as it stood at the end of that day. You can tick or strike out something you forgot to mark. Everything else is changed on today's DAP.</p><button class="btn primary" data-act="go-today">Back to today</button></div>`;
  if (m === 'future') out += `<div class="notice day"><p>This is what is due on the DAP of ${esc(longDate(ui.view))}. A task you add here is scheduled for that day.</p><button class="btn primary" data-act="go-today">Back to today</button></div>`;
  if (store.note) out += `<div class="notice bad"><p>${esc(store.note)}</p></div>`;
  if (store.error) out += `<div class="notice bad"><p>The last change could not be written to the data file (${esc(store.error)}). It is kept in this browser until the file can be saved.</p><button class="btn" data-act="retry-save">Save again</button></div>`;
  if (store.state === 'none' && FS_OK) out += `<div class="notice"><p>Your plan is saved only inside this browser for now. Choose a folder and it is also kept as a file, with a dated backup each day.</p><button class="btn primary" data-act="choose-folder">Choose data folder</button></div>`;
  if (!NATIVE && location.protocol === 'file:' && WEB_ADDRESS) out += `<div class="notice bad"><p>The DAP now opens from its web address, which also keeps it in step with your phone. Please use that instead of this file, so the two do not save over each other.</p><a class="btn primary" href="${esc(WEB_ADDRESS)}">Open the DAP</a></div>`;
  if (SYNC_POSSIBLE && sync.on && sync.state === 'signin') out += `<div class="notice"><p>Syncing with your ${NATIVE ? 'PC' : 'phone'} is paused until you sign in to Google again.</p><button class="btn primary" data-act="sync-connect">Sign in to Google</button></div>`;
  if (store.state === 'unsupported' && !NATIVE) out += `<div class="notice"><p>This browser cannot save the plan to a file, so it is kept inside the browser only. Open this page in Edge or Chrome to keep it as a file.</p><button class="btn" data-act="export">Save a copy</button></div>`;
  return out;
}

function rowHtml(t, n) {              // n is the day's number, or null for a task waiting under Later
  const m = mode(), edit = m === 'today', s = st(t), waiting = n === null;
  const steps = kids(t.id).filter(stepShown);
  const shows = m !== 'past';        // reminder markers are not part of a past day
  const noted = steps.some(x => x.note || isLater(x) || (shows && remOf.has(x.id)));
  const rems = shows ? remOf.get(t.id) : null;
  const pt = noted ? ' padtop' : '';
  const name = waiting ? 'the task for ' + dayMonth(s.deferUntil) : 'task ' + n;
  return `<div class="row ${s.status}${noted ? ' has-notes' : ''}${waiting ? ' later' : ''}${t.urgent ? ' urgent' : ''}" data-id="${t.id}">
    ${edit && !waiting ? `<button class="grip${pt}" data-grip tabindex="-1" aria-label="Drag to move this task" title="Drag to move">&#8942;&#8942;</button>` : '<span></span>'}
    <span class="num${pt}" ${waiting ? `title="On the DAP from ${esc(longDate(s.deferUntil))}"` : ''}>${waiting ? dayMonth(s.deferUntil) : n + ')'}</span>
    <span class="${pt.trim()}"><button class="tbox" data-act="toggle" data-id="${t.id}" aria-pressed="${s.status === 'done'}" aria-label="Tick ${name}" ${m === 'future' ? 'disabled' : ''}>${s.status === 'done' ? TICK : ''}</button></span>
    <div class="tmain${pt}">
      ${t.urgent ? '<span class="urg" title="Urgent" aria-label="Urgent">!</span>' : ''}${edit
        ? `<span class="title${anyHit(t.title) ? ' hit' : ''}" contenteditable="plaintext-only" spellcheck="false" data-edit="title" data-id="${t.id}" aria-label="Wording of ${name}">${esc(t.title)}</span>`
        : `<span class="title${anyHit(t.title) ? ' hit' : ''}">${esc(t.title)}</span>`}${rems ? `<button class="rem${rems[0].state === 'due' ? ' due' : ''}" data-act="open" data-id="${t.id}" title="Reminder ${esc(remWhen(rems[0].at, true))}">${BELL}${esc(remWhen(rems[0].at))}${rems.length > 1 ? ' +' + (rems.length - 1) : ''}</button>` : ''}
      ${t.note ? `<button class="tnote" data-act="open" data-id="${t.id}" title="${esc(t.note)}">${esc(oneLine(t.note))}</button>` : ''}
    </div>
    <div class="steps">
      ${steps.map(x => stepHtml(x, noted)).join('')}
      ${edit ? `<span class="${noted ? 'padtop' : ''}"><input class="addstep" data-add="step" data-where="row" data-parent="${t.id}" placeholder="+ step" aria-label="Add a sub-task to ${name}" autocomplete="off"></span>` : ''}
    </div>
    <div class="rend${pt}">
      <button class="pid" data-act="open" data-id="${t.id}" title="Permanent task number. Click for details.">${taskCode(t)}</button>
      ${edit ? `<button class="rmore" data-act="menu" data-id="${t.id}" aria-haspopup="menu" aria-expanded="${ui.menuId === t.id}" aria-label="Later, strike out and details for ${name}" title="Later, strike out, details">&#8943;</button>` : ''}
      ${edit && ui.menuId === t.id ? menuHtml(t, s, waiting) : ''}
    </div>
  </div>`;
}

function menuHtml(t, s, waiting) {     // opens only when its button is clicked, so it never sits over the sub-tasks
  const item = (act, label, extra) => `<button role="menuitem" data-act="${act}" data-id="${t.id}" ${extra || ''}>${label}</button>`;
  let out = '';
  if (s.status === 'open') {
    if (waiting) out += item('defer-clear', 'Bring to today');
    out += `<div class="mrow"><span>Later</span>${item('defer', 'Tomorrow', 'data-days="1"')}${item('defer', '3 days', 'data-days="3"')}${item('defer', 'A week', 'data-days="7"')}${item('later', 'Date')}</div>`;
    out += `<div class="mrow"><span>Remind in</span>${REM_QUICK.map(([m, label]) => item('remind', label, `data-min="${m}"`)).join('')}${item('remind-at', 'At a time')}</div><hr>`;
  }
  if (s.status === 'open') out += item('urgent', t.urgent ? 'Not urgent' : 'Mark urgent');
  out += s.status === 'cancelled' ? item('reopen', 'Restore') : item('strike', 'Strike out');
  out += item('open', 'Details');
  return `<div class="rmenu" role="menu">${out}</div>`;
}

function stepHtml(x, rowNoted) {
  const m = mode(), s = st(x), waiting = isLater(x), off = m === 'future' ? 'disabled' : '';
  const rems = m !== 'past' ? remOf.get(x.id) : null;
  const subs = kids(x.id).filter(stepShown);
  return `<span class="step ${s.status}${rowNoted ? ' noted' : ''}${waiting ? ' later' : ''}${anyHit(x.title + ' ' + x.note) ? ' hit' : ''}" data-id="${x.id}" ${m === 'today' ? 'draggable="true"' : ''}>
    ${rowNoted ? `<span class="snote" title="${esc((rems ? 'Reminder ' + remWhen(rems[0].at, true) + '. ' : '') + (waiting ? 'From ' + longDate(s.deferUntil) + '. ' : '') + x.note)}">${rems ? `<span class="at${rems[0].state === 'due' ? ' due' : ''}">${BELL}${esc(remWhen(rems[0].at))}</span> ` : ''}${waiting ? `<span class="from">from ${dayMonth(s.deferUntil)}</span> ` : ''}${esc(oneLine(x.note))}</span>` : ''}
    <button class="sbtn" data-act="toggle" data-id="${x.id}" aria-pressed="${s.status === 'done'}" ${off}>
      <span class="sline"><span class="sword" data-bind="${x.id}">${esc(x.title)}</span>${subs.length && s.status === 'done' ? TICK : ''}</span>
      ${subs.length ? '' : `<span class="under">${s.status === 'done' ? TICK : ''}</span>`}
    </button>
    <button class="sopen" data-act="open" data-id="${x.id}" aria-label="Details for ${esc(x.title)}" title="Notes, smaller steps, later date">&#8250;</button>
    ${subs.length ? `<span class="subs">${subs.map(miniHtml).join('')}</span>` : ''}
  </span>`;
}
function miniHtml(x) {
  const m = mode(), s = st(x), waiting = isLater(x), off = m === 'future' ? 'disabled' : '';
  const deeper = kids(x.id).filter(stepShown).length;
  const rems = m !== 'past' ? remOf.get(x.id) : null;
  const tip = (rems ? 'Reminder ' + remWhen(rems[0].at, true) + '. ' : '') + (waiting ? 'From ' + longDate(s.deferUntil) + '. ' : '') + (x.note || '');
  return `<span class="mini ${s.status}${waiting ? ' later' : ''}${anyHit(x.title + ' ' + x.note) ? ' hit' : ''}" data-id="${x.id}" ${m === 'today' ? 'draggable="true"' : ''}><button class="sbtn" data-act="toggle" data-id="${x.id}" aria-pressed="${s.status === 'done'}" ${tip ? `title="${esc(tip)}"` : ''} ${off}>
    <span class="sline"><span class="sword" data-bind="${x.id}">${esc(x.title)}</span>${deeper ? `<span class="more">+${deeper}</span>` : ''}</span>
    <span class="under">${s.status === 'done' ? TICK : ''}</span></button></span>`;
}

function demoteHtml(it, edit) {        // in Details: put a task under another task
  const groups = liveSections().map(sec => {
    const list = tasksIn(sec.id).filter(t => taskShown(t) && t.id !== it.id); if (!list.length) return '';
    return `<optgroup label="${esc(sec.name || 'Unnamed section')}">${list.map(t => `<option value="${t.id}">${esc(taskCode(t) + '  ' + t.title)}</option>`).join('')}</optgroup>`;
  }).join('');
  if (!groups) return '';
  return `<label class="fld"><span>Make it a sub-task of <span class="hint">(its own sub-tasks go with it)</span></span>
    <select data-change="demote-task" data-id="${it.id}" ${edit ? '' : 'disabled'}><option value="" selected>It is a task of its own</option>${groups}</select></label>`;
}
function moveStepHtml(it, edit) {      // in Details: choose the task a sub-task belongs to
  const direct = !byId.get(it.parentId).parentId;
  const groups = liveSections().map(sec => {
    const list = tasksIn(sec.id).filter(taskShown); if (!list.length) return '';
    return `<optgroup label="${esc(sec.name || 'Unnamed section')}">${list.map(t => `<option value="${t.id}" ${direct && it.parentId === t.id ? 'selected' : ''}>${esc(taskCode(t) + '  ' + t.title)}</option>`).join('')}</optgroup>`;
  }).join('');
  return `<label class="fld"><span>Under task <span class="hint">(choose another to move it there)</span></span>
    <select data-change="move-step" data-id="${it.id}" ${edit ? '' : 'disabled'}>${direct ? '' : `<option value="" selected>Inside &ldquo;${esc(byId.get(it.parentId).title)}&rdquo;, where it is now</option>`}${groups}<optgroup label="Make it a task of its own in">${liveSections().map(sec => `<option value="S:${sec.id}">${esc(sec.name || 'Unnamed section')}</option>`).join('')}</optgroup></select></label>`;
}

function drawerHtml() {
  const it = byId.get(ui.drawerId); if (!it) return '';
  const m = mode(), edit = m === 'today', off = edit ? '' : 'disabled', s = st(it), waiting = isLater(it);
  const chain = ancestors(it), root = !it.parentId, list = kids(it.id).filter(existed);
  const below = descendants(it.id).length;
  const sec = db.sections.find(x => x.id === chain[0].sectionId);
  const personal = !!sec && sec.kind === 'personal';
  const headings = [...new Set(db.items.filter(x => !x.removed && x.hoHeading).map(x => x.hoHeading))].sort();
  const when = waiting ? `From ${esc(longDate(s.deferUntil))}. Until then it waits under Later.`
    : s.status === 'open' ? (root ? 'Every day until it is ticked or struck out.' : 'With its task, every day until it is ticked or struck out.')
    : `${s.status === 'done' ? 'Ticked' : 'Struck out'} on ${esc(longDate(s.statusDay))}.`;
  return `<aside class="drawer" aria-label="Details">
    <div class="dhead">
      <nav class="crumbs" aria-label="Where this sits">${chain.map((a, i) => i === chain.length - 1
        ? `<span class="here" data-bind="${a.id}">${esc(a.title)}</span>`
        : `<button data-act="open" data-id="${a.id}"><span data-bind="${a.id}">${esc(a.title)}</span></button><span aria-hidden="true">&#8250;</span>`).join('')}</nav>
      <button class="dclose" data-act="close-drawer" aria-label="Close details" title="Close (Esc)">&times;</button>
    </div>
    <div class="drawer-body">
      <label class="fld"><span>${root ? 'Task' : 'Sub-task'}</span>
        <input type="text" class="big${root ? '' : ' step'}" data-edit="title" data-id="${it.id}" value="${esc(it.title)}" autocomplete="off" ${off}></label>
      <div class="state">
        <button class="btn" data-act="mark-open" data-id="${it.id}" aria-pressed="${s.status === 'open'}" ${m === 'future' ? 'disabled' : ''}>Open</button>
        <button class="btn" data-act="mark-done" data-id="${it.id}" aria-pressed="${s.status === 'done'}" ${m === 'future' ? 'disabled' : ''}>Done</button>
        <button class="btn" data-act="mark-struck" data-id="${it.id}" aria-pressed="${s.status === 'cancelled'}" ${m === 'future' ? 'disabled' : ''}>Struck out</button>
      </div>
      <div class="fld"><span class="lbl">On the DAP</span>
        <p class="when">${when}</p>
        ${edit && s.status === 'open' ? `<div class="state">
          <button class="btn" data-act="defer" data-days="1" data-id="${it.id}">Tomorrow</button>
          <button class="btn" data-act="defer" data-days="3" data-id="${it.id}">In 3 days</button>
          <button class="btn" data-act="defer" data-days="7" data-id="${it.id}">In a week</button>
          <span class="pickwrap"><button class="btn" data-act="pick-date">Pick a date</button><input type="date" data-change="defer-date" data-id="${it.id}" min="${addDays(ui.day, 1)}" value="${waiting ? s.deferUntil : ''}" tabindex="-1" aria-label="Pick a later date"></span>
          ${waiting ? `<button class="btn" data-act="defer-clear" data-id="${it.id}">Bring to today</button>` : ''}
        </div>` : ''}
      </div>
      ${edit && s.status === 'open' ? remBlockHtml(it) : ''}
      <label class="fld"><span>Notes</span><textarea data-edit="note" data-id="${it.id}" rows="4" placeholder="PR number, date, who to call" ${off}>${esc(it.note)}</textarea></label>
      <div class="fld"><span class="lbl">${root ? 'Sub-tasks' : 'Smaller steps'}</span>
        ${list.length ? `<ul class="klist">${list.map(k => { const c = kids(k.id).length, ks = st(k); return `<li class="${ks.status}">
          <button class="tbox" data-act="toggle" data-id="${k.id}" aria-pressed="${ks.status === 'done'}" aria-label="Tick ${esc(k.title)}" ${m === 'future' ? 'disabled' : ''}>${ks.status === 'done' ? TICK : ''}</button>

/* =====================================================================
