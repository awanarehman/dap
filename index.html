   ===================================================================== */
const acts = {
  toggle(el, e) { const it = byId.get(el.dataset.id); if (!it) return; const now = st(it).status; setStatus(it.id, e.shiftKey ? (now === 'cancelled' ? 'open' : 'cancelled') : (now === 'open' ? 'done' : 'open')); },
  'go-day'(el) { goDay(el.dataset.day); },
  'go-today'() { goDay(ui.day); },
  'pick-date'(el) { const box = el.parentElement.querySelector('input[type=date]'); try { box.showPicker(); } catch (e) { box.classList.add('show'); box.focus(); } },
  later(el) {                         // open Details and bring up the calendar
    ui.drawerId = el.dataset.id; ui.confirmRemove = null; ui.refocus = '.drawer [data-act="pick-date"]'; render();
    const box = $('.drawer [data-change="defer-date"]'); if (box) { try { box.showPicker(); } catch (e) { } }
  },
  menu(el) { const id = el.dataset.id; ui.menuId = ui.menuId === id ? null : id; ui.refocus = ui.menuId ? '.rmenu button' : `.rmore[data-id="${id}"]`; render(); },
  defer(el) { setDefer(el.dataset.id, addDays(ui.day, +el.dataset.days)); },
  'defer-clear'(el) { setDefer(el.dataset.id, null); },
  strike(el) { setStatus(el.dataset.id, 'cancelled'); },
  reopen(el) { setStatus(el.dataset.id, 'open'); },
  'mark-open'(el) { setStatus(el.dataset.id, 'open'); },
  'mark-done'(el) { setStatus(el.dataset.id, 'done'); },
  'mark-struck'(el) { setStatus(el.dataset.id, 'cancelled'); },
  open(el) { ui.drawerId = el.dataset.id; ui.confirmRemove = null; ui.remError = null; render(); },
  'close-drawer'() { ui.drawerId = null; ui.confirmRemove = null; render(); },
  remove(el) { ui.confirmRemove = el.dataset.id; render(); },
  'remove-no'() { ui.confirmRemove = null; render(); },
  'remove-yes'(el) { removeItem(el.dataset.id); },
  'add-section'() { addSection(); },
  'sec-up'(el) { nudgeSection(el.dataset.sid, -1); },
  'sec-down'(el) { nudgeSection(el.dataset.sid, 1); },
  'sec-remove'(el) { removeSection(el.dataset.sid); },
  undo() { undo(); },
  redo() { redo(); },
  handover() {                        // period defaults: from the day after the last notes (or the plan's first day) to today
    const last = db.handovers[db.handovers.length - 1];
    let from = last && isDay(last.to) ? addDays(last.to, 1) : planStart();
    const to = ui.day; if (from > to) from = to;
    ui.ho = { from, to, no: last && +last.no ? +last.no + 1 : 36, msg: null, err: null };
    ui.dialog = 'handover'; ui.menuId = null; render();
  },
  'ho-draft'(el) { const it = byId.get(el.dataset.id); if (it) change(() => { it.hoText = reportText(draftReport(it, it, ui.day)); it.updatedAt = nowIso(); }); },
  async 'ho-create'() {
    const h = ui.ho; if (!h) return;
    const groups = handoverModel(h.from, h.to); if (!groups.length) return;
    h.msg = null; h.err = null;
    const blob = docxBlob(groups), base = hoFileName(h);
    let name = base + '.docx', inFolder = false;
    if (store.state === 'connected' && store.parent) {       // beside the DAP file, never over an existing file
      try {
        for (let n = 2; await fileExists(store.parent, name); n++) name = `${base} (${n}).docx`;
        const w = await (await store.parent.getFileHandle(name, { create: true })).createWritable();
        await w.write(blob); await w.close(); inFolder = true;
      } catch (e) { inFolder = false; name = base + '.docx'; }
    }
    let shared = false;
    if (!inFolder && NATIVE) {
      try { await shareFile(blob, name); shared = true; } catch (e) { h.err = 'The file could not be shared (' + (e.message || e) + ').'; render(); return; }
    } else if (!inFolder) downloadBlob(blob, name);
    db.handovers.push({ id: uid(), no: h.no, from: h.from, to: h.to, file: name, createdAt: nowIso() }); save();
    h.msg = inFolder ? `Saved as “${name}” in ${store.parent.name ? `the folder “${store.parent.name}”` : 'your data folder'}. Open it in Word to check and finish it.` : shared ? `“${name}” was made and offered to share. Save it to Drive or Files, or send it, then open it in Word to check and finish it.` : `Downloaded as “${name}”. Look in your Downloads folder.`;
    render();
  },
  settings() { ui.dialog = 'settings'; ui.importDb = null; ui.importError = null; render(); },
  'close-dialog'() { ui.dialog = null; ui.importDb = null; ui.importError = null; db.sets = db.sets.filter(s => s.name.trim()); save(); render(); },
  'set-add'(el) { change(() => { const s = { id: uid(), for: el.dataset.kind === 'task' ? 'task' : 'step', regex: false, name: '', steps: [], updatedAt: nowIso() }; db.sets.push(s); ui.refocus = `[data-edit="name"][data-setid="${s.id}"]`; }); },
  'set-remove'(el) { change(() => { db.sets = db.sets.filter(s => s.id !== el.dataset.setid); }); },
  'choose-folder'() { chooseFolder(); },
  async unlock() {
    let p = 'denied';
    try { p = await store.parent.requestPermission({ mode: 'readwrite' }); } catch (e) { }
    if (p === 'granted') await connect(store.parent, false);
    else { store.note = 'Access was not allowed, so the plan could not be opened. Try again and choose Allow.'; render(); }
  },
  'retry-save'() { store.error = null; writeFile(); render(); },
  export() { downloadCopy(); },
  import() { $('#importfile').click(); },
  'import-no'() { ui.importDb = null; render(); },
  async 'import-yes'() {
    const incoming = ui.importDb; ui.importDb = null;
    if (store.state === 'connected') await keepCopyOf(db, 'replaced');
    change(() => { db = tidy(incoming); ui.drawerId = null; });
    stampReset();
  },
  async 'use-file'() { const mine = db; db = tidy(store.pendingFile); await keepCopyOf(mine, 'from-browser'); await finishConnect(); },
  async 'use-screen'() { await keepCopyOf(store.pendingFile, 'replaced'); await finishConnect(); },
  remind(el) { addReminder(el.dataset.id, Date.now() + (+el.dataset.min) * 60000); },
  'remind-at'(el) { ui.drawerId = el.dataset.id; ui.confirmRemove = null; ui.remError = null; ui.refocus = '.drawer [data-rem-time]'; render(); },
  'rem-set'(el) {
    const time = $('.drawer [data-rem-time]').value, day = $('.drawer [data-rem-day]').value;
    if (!/^\d\d:\d\d/.test(time) || !isDay(day)) { ui.remError = 'Enter a time first.'; render(); return; }
    const [h, mi] = time.split(':').map(Number), at = dayToDate(day); at.setHours(h, mi, 0, 0);
    if (at.getTime() <= Date.now()) { ui.remError = `${clockTime(at)} has already passed today. Choose a later time, or another day.`; ui.refocus = '.drawer [data-rem-time]'; render(); return; }
    addReminder(el.dataset.id, at.getTime());
  },
  'rem-remove'(el) { const r = remById(el.dataset.rid); if (r) change(() => { r.state = 'dismissed'; r.updatedAt = nowIso(); }); },
  'rem-done'(el) { answerReminder(el.dataset.rid, 'done'); },
  'rem-snooze'(el) { answerReminder(el.dataset.rid, 'snooze', +el.dataset.min); },
  'rem-dismiss'(el) { answerReminder(el.dataset.rid, 'dismiss'); },
  'rem-open'(el) { const r = remById(el.dataset.rid); if (!r) return; ui.view = ui.day; ui.drawerId = r.itemId; ui.confirmRemove = null; render(); },
  'notify-allow'() { try { Notification.requestPermission().then(() => render()); } catch (e) { } },
  'notify-test'() { try { new Notification('DAP test notification', { body: 'Reminders will appear like this.' }); } catch (e) { } },
  fold(el) { const sec = db.sections.find(x => x.id === el.dataset.sid); if (!sec) return; sec.collapsed = !sec.collapsed; sec.updatedAt = nowIso(); save(); ui.refocus = `.fold[data-sid="${sec.id}"]`; render(); },      // a view choice, not part of undo
  'toggle-compact'() { db.settings.compact = !db.settings.compact; save(); ui.refocus = '[data-act="toggle-compact"]'; render(); },
  urgent(el) { setUrgent(el.dataset.id); },
  'q-clear'() { ui.q = ''; render(); },
  'goto-task'(el) {                     // a search result from another day: go to the day it was closed (or today) and open it
    const t = byId.get(el.dataset.id); if (!t) return;
    ui.view = t.status !== 'open' ? t.statusDay : ui.day;
    ui.drawerId = t.id; ui.confirmRemove = null; ui.menuId = null; render();
    const r = $(`.row[data-id="${t.id}"]`); if (r) r.scrollIntoView({ block: 'center' });
  },
  print() { ui.dialog = 'print'; ui.menuId = null; render(); },
  'print-go'() { const box = $('#pr-personal'); db.settings.printPersonal = !!(box && box.checked); save(); ui.dialog = null; doPrint(); },
  'toggle-done-steps'() { db.settings.showDoneSteps = !db.settings.showDoneSteps; save(); ui.refocus = '[data-act="toggle-done-steps"]'; render(); },      // a view choice, so not part of undo
  reload() { location.reload(); },
  'sync-connect'() { connectSync(); },
  'sync-now'() { sync.st.seen = {}; syncSoon(0); },
  async 'sync-off'() { await signOut(); render(); },
  'plan-combine'() { const p = sync.pendingPlan; sync.pendingPlan = null; if (p.R.meta.createdAt < db.meta.createdAt) { db.meta.id = p.R.meta.id; db.meta.createdAt = p.R.meta.createdAt; } sync.st.joined = [...(sync.st.joined || []), p.R.meta.id, db.meta.id]; save(); render(); syncSoon(100); },
  async 'plan-replace'() { const p = sync.pendingPlan; sync.pendingPlan = null; if (store.state === 'connected') await keepCopyOf(db, 'replaced-by-drive'); const keep = { compact: db.settings.compact, printPersonal: db.settings.printPersonal }; db = tidy(JSON.parse(JSON.stringify(p.R))); Object.assign(db.settings, keep); await idbSet(p.devKey, { remote: p.R, local: JSON.parse(JSON.stringify(db)) }); afterMerge(); save(); syncSoon(100); }
};

document.addEventListener('click', e => {
  const veil = e.target.closest('[data-veil]');
  if (veil && e.target === veil) { acts['close-dialog'](); return; }
  const el = e.target.closest('[data-act]');
  const menuWasOpen = ui.menuId;
  if (menuWasOpen && !(el && el.dataset.act === 'menu')) ui.menuId = null;      // a click anywhere else closes a row's menu
  if (el && !el.disabled) { const fn = acts[el.dataset.act]; if (fn) fn(el, e); }
  if (menuWasOpen && !ui.menuId && $('.rmenu')) render();
});

document.addEventListener('contextmenu', e => {     // right-click a step for its details
  const step = e.target.closest('.mini, .step'); if (!step) return;
  e.preventDefault(); ui.drawerId = step.dataset.id; ui.confirmRemove = null; render();
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.change === 'move-section') moveTask(t.dataset.id, t.value, null);
  else if (t.dataset.change === 'demote-task') { if (t.value) demoteTask(t.dataset.id, t.value, null); }
  else if (t.dataset.change === 'urgent') setUrgent(t.dataset.id, t.checked);
  else if (t.dataset.change === 'move-step') { if (t.value.startsWith('S:')) promoteStep(t.dataset.id, t.value.slice(2)); else if (t.value) moveStep(t.dataset.id, t.value, null); }
  else if (t.dataset.change === 'set-regex') change(() => { const x = db.sets.find(q => q.id === t.dataset.setid); if (x) { x.regex = t.checked; x.updatedAt = nowIso(); } });
  else if (t.dataset.change === 'goto-day') { if (isDay(t.value)) goDay(t.value); }
  else if (t.dataset.change === 'defer-date') { if (isDay(t.value) && t.value > ui.day) setDefer(t.dataset.id, t.value); }
  else if (t.dataset.change === 'ho-from') { if (ui.ho && isDay(t.value) && t.value <= ui.ho.to) { ui.ho.from = t.value; ui.ho.msg = null; render(); } }
  else if (t.dataset.change === 'ho-to') { if (ui.ho && isDay(t.value) && t.value >= ui.ho.from) { ui.ho.to = t.value; ui.ho.msg = null; render(); } }
  else if (t.dataset.change === 'ho-no') { const n = Math.floor(+t.value); if (ui.ho && n >= 1) { ui.ho.no = n; ui.ho.msg = null; render(); } }
  else if (t.dataset.change === 'set-notify') change(() => { db.settings.notify = t.checked; });
  else if (t.dataset.change === 'set-repeat') change(() => { db.settings.repeatReminders = t.checked; });
  else if (t.dataset.change === 'devname') { const v = t.value.trim().slice(0, 30); if (v && sync.device) { sync.device.name = v; idbSet('sync.device', sync.device).catch(() => { }); sync.st.uploaded = null; syncSoon(500); } }
  else if (t.id === 'importfile' && t.files[0]) {
    t.files[0].text().then(txt => {
      let d = null; try { d = JSON.parse(txt); } catch (err) { }
      if (d && d.app === APP && Array.isArray(d.items)) { ui.importDb = tidy(d); ui.importError = null; }
      else { ui.importDb = null; ui.importError = 'That file is not a Daily Action Plan data file.'; }
      render();
    });
  }

    const key = k + ':' + x.id, now = stampKey(x), was = stampSeen.get(key);
    if (was !== undefined && was !== now && !(x.updatedAt && x.updatedAt > (sync.stampedAt || ''))) x.updatedAt = t;
    stampSeen.set(key, now);
  }
  sync.stampedAt = t;
}

/* ---------- signing in ---------- */
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const randomText = n => b64url(crypto.getRandomValues(new Uint8Array(n)));
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');        // the address registered with Google
async function webSignIn() {          // goes to Google's page and comes back here with a code
  const verifier = randomText(48), state = randomText(12);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('dap.auth', JSON.stringify({ verifier, state }));
  flush();
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + new URLSearchParams({
    client_id: GOOGLE.clientId, redirect_uri: REDIRECT, response_type: 'code', scope: DRIVE_SCOPE,
    access_type: 'offline', prompt: 'consent', include_granted_scopes: 'false', code_challenge: challenge, code_challenge_method: 'S256', state
  });
}
async function tokenCall(params) {
  const r = await fetch('https://oauth2.googleapis.com/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(Object.assign({ client_id: GOOGLE.clientId, client_secret: GOOGLE.clientSecret }, params)) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error_description || j.error || ('Google answered ' + r.status)); e.code = j.error; throw e; }
  return j;
}
async function finishWebSignIn() {    // on coming back from Google's page; true if this load was the return
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return false;
  history.replaceState(null, '', REDIRECT);
  let saved = null; try { saved = JSON.parse(sessionStorage.getItem('dap.auth')); } catch (e) { }
  sessionStorage.removeItem('dap.auth');
  if (q.has('error') || !saved || saved.state !== q.get('state')) { sync.error = q.get('error') === 'access_denied' ? 'Google access was not given.' : 'Signing in did not complete. Try again.'; return true; }
  try {
    const j = await tokenCall({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: REDIRECT, code_verifier: saved.verifier });
    if (!j.refresh_token) throw new Error('Google did not give lasting access. Try again.');
    await idbSet('sync.auth', { refresh: j.refresh_token, at: nowIso() });
    sync.token = j.access_token; sync.tokenExp = Date.now() + (j.expires_in - 120) * 1000;
    await idbSet('sync.on', true); sync.on = true; sync.error = null;
  } catch (e) { sync.error = 'Signing in did not complete (' + e.message + ').'; }
  return true;
}
async function getToken(interactive) {
  if (sync.token && Date.now() < sync.tokenExp) return sync.token;
  if (NATIVE) {
    try {
      const r = await Native.auth.getToken({ interactive: !!interactive, scope: DRIVE_SCOPE });
      sync.token = r.accessToken; sync.tokenExp = Date.now() + 45 * 60000; return sync.token;
    } catch (e) {
      if (/NEED_CONSENT|consent|resolution/i.test((e.code || '') + ' ' + (e.message || ''))) { sync.state = 'signin'; return null; }
      throw e;
    }
  }
  const a = await idbGet('sync.auth').catch(() => null);
  if (!a || !a.refresh) { sync.state = 'signin'; return null; }
  try {
    const j = await tokenCall({ grant_type: 'refresh_token', refresh_token: a.refresh });
    sync.token = j.access_token; sync.tokenExp = Date.now() + (j.expires_in - 120) * 1000; return sync.token;
  } catch (e) {
    if (e.code === 'invalid_grant') { await idbSet('sync.auth', null); sync.state = 'signin'; return null; }
    throw e;
  }
}
async function signOut() {
  try {
    if (NATIVE) await Native.auth.signOut();
    else { const a = await idbGet('sync.auth'); if (a && a.refresh) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(a.refresh), { method: 'POST' }).catch(() => { }); await idbSet('sync.auth', null); }
  } catch (e) { }
  sync.token = null; sync.tokenExp = 0; sync.on = false; sync.state = 'off'; sync.error = null;
  await idbSet('sync.on', false).catch(() => { });
}

/* ---------- Google Drive ---------- */
async function gfetch(url, opts, retried) {
  const token = await getToken(false); if (!token) throw Object.assign(new Error('signin'), { signin: true });
  const r = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ Authorization: 'Bearer ' + token }, (opts && opts.headers) || {}) }));
  if (r.status === 401 && !retried) { if (NATIVE) await Native.auth.clearToken({ token }).catch(() => { }); sync.token = null; sync.tokenExp = 0; return gfetch(url, opts, true); }
  if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch (e) { } throw new Error(m || ('Drive answered ' + r.status)); }
  return r;
}
const DRIVE = 'https://www.googleapis.com/drive/v3/files', UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
const dq = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
async function driveFolder() {
  if (sync.st.folderId) return sync.st.folderId;
  const q = `mimeType='application/vnd.google-apps.folder' and name='${dq(SYNC_FOLDER)}' and trashed=false`;
  const j = await (await gfetch(`${DRIVE}?${new URLSearchParams({ q, fields: 'files(id,createdTime)', orderBy: 'createdTime', spaces: 'drive' })}`)).json();
  let id = j.files && j.files[0] && j.files[0].id;
  if (!id) id = (await (await gfetch(DRIVE + '?fields=id', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: SYNC_FOLDER, mimeType: 'application/vnd.google-apps.folder' }) })).json()).id;
  sync.st.folderId = id; return id;
}
async function driveList(folderId) {
  const q = `'${folderId}' in parents and trashed=false and mimeType='application/json'`;
  const j = await (await gfetch(`${DRIVE}?${new URLSearchParams({ q, fields: 'files(id,name,modifiedTime,appProperties,size)', pageSize: '100' })}`)).json();
  return j.files || [];
}
async function driveDownload(id) { return (await gfetch(`${DRIVE}/${id}?alt=media`)).json(); }
async function driveUpload(fileId, folderId, name, obj) {
  const body = JSON.stringify(obj), props = { dapDevice: sync.device.id, dapName: sync.device.name, dapPlan: obj.meta.id };
  if (fileId) {
    const r = await gfetch(`${UPLOAD}/${fileId}?uploadType=multipart&fields=id,modifiedTime`, { method: 'PATCH', headers: { 'Content-Type': 'multipart/related; boundary=dapsync' }, body: multipart({ name, appProperties: props }, body) });
    return r.json();
  }
  const r = await gfetch(`${UPLOAD}?uploadType=multipart&fields=id,modifiedTime`, { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=dapsync' }, body: multipart({ name, parents: [folderId], mimeType: 'application/json', appProperties: props }, body) });
  return r.json();
}
const multipart = (meta, body) => `--dapsync\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--dapsync\r\nContent-Type: application/json\r\n\r\n${body}\r\n--dapsync--`;

/* ---------- one round: fetch the others' changes, merge, then send this device's plan ---------- */
const typingNow = () => { const el = document.activeElement; return !!el && (el.isContentEditable || /^(INPUT|TEXTAREA)$/.test(el.tagName)) && el.id !== 'q'; };
function syncSoon(ms) {
  if (!sync.on || !SYNC_POSSIBLE) return;
  clearTimeout(sync.timer); sync.timer = setTimeout(syncOnce, ms === undefined ? 4000 : ms);
}
async function syncOnce() {
  clearTimeout(sync.timer); sync.timer = null;
  if (!sync.on || !SYNC_POSSIBLE || !db || ui.second || store.state === 'locked' || store.state === 'choice' || sync.pendingPlan) return;
  if (sync.busy) { sync.again = true; return; }
  if (typingNow() || ui.dialog === 'handover') { syncSoon(3000); return; }
  if (navigator.onLine === false) { sync.state = 'offline'; renderSyncStatus(); syncSoon(SYNC_EVERY); return; }
  const before = sync.state;
  sync.busy = true; sync.state = 'working'; renderSyncStatus();
  try {
    if (saveTimer) flush();
    stampChanges();
    const folderId = await driveFolder();
    const files = await driveList(folderId);
    const others = files.filter(f => f.appProperties && f.appProperties.dapDevice && f.appProperties.dapDevice !== sync.device.id);
    sync.others = others.map(f => ({ name: f.appProperties.dapName || f.name, modified: f.modifiedTime }));
    let changed = false;
    for (const f of others) {
      if (sync.st.seen[f.id] === f.modifiedTime) continue;
      const R = await driveDownload(f.id);
      if (!R || R.app !== APP || !R.meta) { sync.st.seen[f.id] = f.modifiedTime; continue; }
      if (typingNow()) { sync.again = true; break; }             // never change the page under someone typing; try again shortly
      const devKey = 'sync.base.' + f.appProperties.dapDevice;
      let base = await idbGet(devKey).catch(() => null);
      if (R.meta.id !== db.meta.id) {
        if (!hasContent(db)) { const keep = { compact: db.settings.compact, printPersonal: db.settings.printPersonal }; db = tidy(JSON.parse(JSON.stringify(R))); Object.assign(db.settings, keep); base = null; changed = true; await idbSet(devKey, { remote: R, local: JSON.parse(JSON.stringify(db)) }); sync.st.seen[f.id] = f.modifiedTime; continue; }
        if (!(sync.st.joined || []).includes(R.meta.id)) { sync.pendingPlan = { R, f, devKey }; render(); break; }
      }
      const m = mergeDb(db, R, base && base.remote, base && base.local);
      if (m.changed) { db = tidy(m.db); changed = true; }
      await idbSet(devKey, { remote: R, local: JSON.parse(JSON.stringify(db)) });
      sync.st.seen[f.id] = f.modifiedTime;
    }
    if (changed) afterMerge();
    if (!sync.pendingPlan && (!sync.st.fileId || sync.st.uploaded !== db.meta.savedAt)) {
      const savedAt = db.meta.savedAt;
      const res = await driveUpload(sync.st.fileId, folderId, `DAP ${sync.device.name} ${sync.device.id.slice(0, 8)}.json`, db);
      sync.st.fileId = res.id; sync.st.uploaded = savedAt; sync.st.seen[res.id] = res.modifiedTime;
    }
    await idbSet('sync.state', sync.st);
    sync.last = new Date(); sync.error = null; sync.state = 'ok';
  } catch (e) {
    if (e.signin || sync.state === 'signin') { sync.state = 'signin'; sync.error = null; }
    else if (navigator.onLine === false || /Failed to fetch|NetworkError|network/i.test(e.message)) { sync.state = 'offline'; sync.error = null; }
    else { sync.state = 'error'; sync.error = e.message; if (/not found|404/i.test(e.message)) { sync.st.folderId = null; sync.st.fileId = null; } }
  }
  sync.busy = false;
  if ((before === 'signin') !== (sync.state === 'signin')) render(); else renderSyncStatus();      // the sign-in notice comes and goes with the page
  if (sync.again) { sync.again = false; syncSoon(1500); }
  else if (sync.on && sync.state !== 'signin') syncSoon(document.hidden ? SYNC_EVERY * 5 : SYNC_EVERY);
}
function afterMerge() {           // the plan on screen now holds the other devices' changes
  db.meta.savedAt = nowIso();
  undoStack.length = 0; redoStack.length = 0;       // undo would otherwise take back what came from the other device
  stampReset();
  if (ui.drawerId && !db.items.some(x => x.id === ui.drawerId && !x.removed)) ui.drawerId = null;
  mirrorNow(); writeFile();
  sync.merged = new Date();
  render();
  scheduleAlarms();
}
async function startSync() {
  try {
    let dev = await idbGet('sync.device');
    if (!dev || !dev.id) { dev = { id: uid(), name: NATIVE ? 'Phone' : 'PC' }; await idbSet('sync.device', dev); }
    sync.device = dev;
    sync.st = Object.assign({ folderId: null, fileId: null, uploaded: null, seen: {}, joined: [] }, (await idbGet('sync.state')) || {});
    sync.on = !!(await idbGet('sync.on'));
  } catch (e) { sync.on = false; }
  stampReset();
  if (sync.on && SYNC_POSSIBLE) syncSoon(800);
  renderSyncStatus();
}
async function connectSync() {          // from the Connect button
  if (!SYNC_POSSIBLE) return;
  sync.error = null;
  if (NATIVE) {
    try { await getToken(true); await idbSet('sync.on', true); sync.on = true; sync.state = 'working'; render(); syncSoon(100); }
    catch (e) { sync.error = 'Google sign-in did not complete (' + (e.message || e) + ').'; render(); }
    return;
  }
  webSignIn();
}

/* ---------- what the sync line and the Settings section show ---------- */
function syncLine() {
  if (!SYNC_POSSIBLE || !sync.on) return '';
  if (sync.state === 'working') return 'Syncing';
  if (sync.state === 'offline') return 'Offline, will sync later';
  if (sync.state === 'signin') return 'Sync needs Google sign-in';
  if (sync.state === 'error') return 'Sync failed';
  return sync.last ? `Synced ${clockTime(sync.last)}` : '';
}
function renderSyncStatus() {
  const el = $('#syncstate'); if (!el) return;
  const t = syncLine(); el.textContent = t; el.classList.toggle('warn', sync.state === 'error' || sync.state === 'signin'); el.hidden = !t;
}
function syncSettingsHtml() {
  let body;
  if (!GOOGLE.clientId) body = `<p>Sync with the phone is not set up yet. It needs a Google project, created once (see the setup notes).</p>`;
  else if (!NATIVE && !WEB_SYNC_OK) body = `<p>Sync works when the DAP is opened from its web address, not from the file on this PC.</p>`;
  else if (!sync.on) body = `<p>Keep this plan in step with your ${NATIVE ? 'PC' : 'phone'} through your Google Drive. The DAP asks only for access to the files it creates itself, in a folder named &ldquo;${SYNC_FOLDER}&rdquo;; the rest of your Drive stays out of its reach.</p>
      <div class="btns" style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn primary" data-act="sync-connect">Connect Google Drive</button></div>`;
  else {
    const others = sync.others.length ? sync.others.map(o => `${esc(o.name)} (last sent ${esc(new Date(o.modified).toLocaleString('en-GB', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }))})`).join(', ') : 'none yet';
    body = `<p>${sync.state === 'signin' ? 'Google needs you to sign in again before syncing can continue.' : sync.state === 'error' ? 'The last sync failed: ' + esc(sync.error || '') : sync.state === 'offline' ? 'No internet just now; changes are kept and sent when it is back.' : sync.last ? `Last synced at ${clockTime(sync.last)}.` : 'Connected.'}</p>
      <p>This device is called <input class="devname" data-change="devname" value="${esc(sync.device.name)}" aria-label="This device's name" maxlength="30">. Other devices: ${others}.</p>
      <div class="btns" style="display:flex;gap:6px;flex-wrap:wrap">${sync.state === 'signin' ? '<button class="btn primary" data-act="sync-connect">Sign in to Google</button>' : '<button class="btn" data-act="sync-now">Sync now</button>'}<button class="btn" data-act="sync-off">Disconnect</button></div>`;
  }
  return `<h3>Sync with ${NATIVE ? 'the PC' : 'the phone'}</h3>${sync.error && !sync.on ? `<div class="notice bad"><p>${esc(sync.error)}</p></div>` : ''}${body}`;
}
function planChoiceHtml() {
  const p = sync.pendingPlan, n = p.R.items.filter(i => !i.removed && !i.parentId).length;
  return `<div class="veil"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pc-h">
    <h2 id="pc-h">Your Drive holds a different plan</h2>
    <p>The ${esc(p.f.appProperties.dapName || 'other device')} has a plan with ${plural(n, 'task')}, last saved ${esc(new Date(p.R.meta.savedAt).toLocaleString('en-GB'))}. This device has a different one. Combine the two into one plan, or replace this device's plan with the one from Drive?</p>
    <div class="foot"><button class="btn" data-act="plan-replace">Use the plan from Drive</button><button class="btn primary" data-act="plan-combine">Combine them</button></div>
  </div></div>`;
}

const TOUCH_KEY = `<p class="key"><b>Tap</b> a step or a task box to tick it. <b>Long-press</b> a step for its notes, smaller steps, a later date, a reminder or to strike it out. <b>&hellip;</b> beside a task: later, reminders, urgent, strike out. <b>Tap a task's ID</b> for its Details, where it can also be moved to another section or under another task. The <b>&#9662;</b> beside a section folds it away. The phone's <b>Back</b> button closes what is open.</p>`;

/* ---------- on the phone: alarms that sound with the DAP closed ---------- */
const alarmId = (rid, k) => { let h = 0; for (const c of rid) h = (h * 31 + c.charCodeAt(0)) | 0; return ((h & 0x3ffffff) * 8 + k) | 0; };
let alarmTimer = null;
function scheduleAlarms() { if (NATIVE) { clearTimeout(alarmTimer); alarmTimer = setTimeout(doScheduleAlarms, 400); } }
async function doScheduleAlarms() {
  if (!db) return;
  try {
    const want = [], now = Date.now();
    for (const r of db.reminders) {
      if (r.state !== 'pending' && r.state !== 'due') continue;
      const it = db.items.find(x => x.id === r.itemId && !x.removed); if (!it) continue;
      let top = it; while (top.parentId) { const up = db.items.find(x => x.id === top.parentId); if (!up) break; top = up; }
      const at = new Date(r.at).getTime(), repeats = db.settings.repeatReminders ? 6 : 0;
      for (let k = 0; k <= repeats; k++) {
        const when = at + k * 5 * 60000; if (when <= now + 1000) continue;
        want.push({ id: alarmId(r.id, k), title: 'DAP reminder: ' + it.title, body: (top !== it ? 'Under ' + top.title + '. ' : '') + 'Due ' + remWhen(r.at, true) + '.', schedule: { at: new Date(when), allowWhileIdle: true }, actionTypeId: 'dap-rem', extra: { rid: r.id }, channelId: 'dap-reminders' });
      }
    }
    const pending = (await Native.notes.getPending()).notifications || [];
    const wantIds = new Set(want.map(n => n.id));
    const drop = pending.filter(n => !wantIds.has(+n.id)).map(n => ({ id: +n.id }));
    if (drop.length) await Native.notes.cancel({ notifications: drop });
    const have = new Set(pending.map(n => +n.id));
    const add = want.filter(n => !have.has(n.id));
    if (add.length) await Native.notes.schedule({ notifications: add.slice(0, 60) });
    const live = new Set(db.reminders.filter(r => r.state === 'pending' || r.state === 'due').map(r => r.id));
    const shown = ((await Native.notes.getDeliveredNotifications()).notifications || []).filter(n => n.extra && n.extra.rid && !live.has(n.extra.rid));
    if (shown.length) await Native.notes.removeDeliveredNotifications({ notifications: shown });
  } catch (e) { console.warn('alarms', e); }
}
async function clearDelivered(rid) {
  if (!NATIVE) return;
  try { const ids = []; for (let k = 0; k <= 6; k++) ids.push({ id: alarmId(rid, k) }); await Native.notes.cancel({ notifications: ids }); await Native.notes.removeDeliveredNotifications({ notifications: ids.map(x => ({ id: x.id, title: '', body: '' })) }); } catch (e) { }
}
async function startNative() {
  if (!NATIVE) return;
  try {
    await Native.notes.createChannel({ id: 'dap-reminders', name: 'Reminders', description: 'DAP reminders', importance: 5, visibility: 1, vibration: true });
    await Native.notes.registerActionTypes({ types: [{ id: 'dap-rem', actions: [{ id: 'done', title: 'Done' }, { id: 'snooze10', title: 'Snooze 10 min' }, { id: 'snooze60', title: 'Snooze 1 h' }] }] });
    const p = await Native.notes.checkPermissions(); if (p.display !== 'granted') await Native.notes.requestPermissions();
    Native.notes.addListener('localNotificationActionPerformed', a => {
      const rid = a.notification && a.notification.extra && a.notification.extra.rid; if (!rid || !db) return;
      if (a.actionId === 'done') answerReminder(rid, 'done');
      else if (a.actionId === 'snooze10') answerReminder(rid, 'snooze', 10);
      else if (a.actionId === 'snooze60') answerReminder(rid, 'snooze', 60);
      else acts['rem-open']({ dataset: { rid } });
    });
    Native.app.addListener('appStateChange', s => { if (s.isActive) { reminderTick(); syncSoon(300); } else { flush(); if (sync.on) syncOnce(); } });
    Native.app.addListener('backButton', () => {
      if (ui.menuId) { ui.menuId = null; render(); }
      else if (sync.pendingPlan || store.state === 'choice') return;
      else if (ui.dialog) acts['close-dialog']();
      else if (ui.drawerId) acts['close-drawer']();
      else if (ui.q) { ui.q = ''; render(); }
      else if (ui.view !== ui.day) goDay(ui.day);
      else Native.app.minimizeApp();
    });
  } catch (e) { console.warn('native start', e); }
  scheduleAlarms();
}

/* ---------- handing a file to the person: saved beside the plan, downloaded, or (on the phone) shared ---------- */
async function shareFile(blob, name) {     // phone only: saved in the app's cache, then offered to WhatsApp, Drive, Files and so on
  const data = await new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => no(r.error); r.readAsDataURL(blob); });
  const w = await Native.fs.writeFile({ path: name, data, directory: 'CACHE' });
  await Native.share.share({ title: name, files: [w.uri], dialogTitle: 'Send or save ' + name });
}
function downloadBlob(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* =====================================================================
   7. Start-up
   ===================================================================== */
async function start() {
  if (NATIVE) document.body.classList.add('native');
  if (!NATIVE && (location.protocol === 'https:' || location.hostname === 'localhost') && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });   // so the page opens without internet
  const returning = !NATIVE && GOOGLE.clientId ? await finishWebSignIn() : false;
  if (navigator.locks) {      // only one open copy may edit the plan
    const got = await new Promise(res => { navigator.locks.request('dap-single-copy', { ifAvailable: true }, lock => { res(!!lock); return lock ? new Promise(() => { }) : undefined; }); });
    if (!got) { ui.second = true; db = newDb(); render(); return; }
  }
  let mirror = null, mirror2 = null;
  try { const txt = localStorage.getItem(MIRROR_KEY); if (txt) mirror = JSON.parse(txt); } catch (e) { }
  try { const txt = await idbGet('mirror'); if (txt) mirror2 = JSON.parse(txt); } catch (e) { }
  if (mirror2 && mirror2.app === APP && (!mirror || mirror.app !== APP || (mirror2.meta && mirror.meta && mirror2.meta.savedAt > mirror.meta.savedAt))) mirror = mirror2;
  db = mirror && mirror.app === APP ? tidy(mirror) : newDb();
  await startSync();
  if (returning && sync.on) { render(); syncSoon(200); }
  startNative();

  if (!FS_OK) { store.state = 'unsupported'; render(); return; }
  let parent = null;
  try { parent = await idbGet('parent'); } catch (e) { }
  if (!parent) { store.state = 'none'; render(); return; }
  store.parent = parent;
  let p = 'prompt';
  try { p = await parent.queryPermission({ mode: 'readwrite' }); } catch (e) { }
  if (p === 'granted') await connect(parent, false);
  else { store.state = 'locked'; render(); }
}
start();
